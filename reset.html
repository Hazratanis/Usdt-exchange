<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Reset Password — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' }
        },
        fontFamily: { 'display': ['Poppins','sans-serif'], 'body': ['Inter','sans-serif'] }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    padding: 16px;
  }
  
  input {
    -webkit-user-select: text;
    user-select: text;
  }
  
  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }
  
  .gold-gradient { 
    background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%); 
  }
  
  .black-card { 
    background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%); 
    border: 1px solid #2a2a2a; 
  }
  
  .gold-glow { box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); }
  
  .input-dark { 
    background: #0a0a0a; 
    border: 2px solid #2a2a2a; 
    color: white; 
    font-size: 16px;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
  }
  
  .input-dark:focus { 
    border-color: #f59e0b; 
  }
  
  .input-dark::placeholder { color: #4a4a4a; }
  
  .blob { 
    position: fixed; 
    border-radius: 50%; 
    filter: blur(80px); 
    opacity: 0.25; 
    animation: blobFloat 8s ease-in-out infinite; 
    pointer-events: none;
    z-index: 0;
  }
  
  @keyframes blobFloat { 
    0%,100%{transform:translate(0,0) scale(1)} 
    33%{transform:translate(30px,-30px) scale(1.1)} 
    66%{transform:translate(-20px,20px) scale(0.9)} 
  }
  
  @media screen and (max-width: 768px) {
    input { font-size: 16px !important; }
  }
</style>
</head>
<body>

<div class="blob bg-gold-500 w-64 h-64 -top-20 -left-20"></div>
<div class="blob bg-yellow-500 w-64 h-64 -bottom-20 -right-20" style="animation-delay: 2s;"></div>

<main class="relative z-10 w-full max-w-sm mx-auto">

  <!-- LOGO -->
  <div class="text-center mb-6">
    <a href="index.html" class="inline-block">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl shadow-lg gold-glow mx-auto">💎</div>
    </a>
    <h1 class="text-2xl font-bold text-white mt-4">Reset Password</h1>
    <p class="text-sm text-gray-400 mt-1">Enter your new password</p>
  </div>

  <!-- RESET CARD -->
  <div class="black-card rounded-2xl p-6 shadow-2xl">

    <!-- LOADING -->
    <div id="loadingBox" class="text-center py-8">
      <div class="inline-block w-8 h-8 border-4 border-gold-500/30 border-t-gold-500 rounded-full animate-spin"></div>
      <p class="text-gray-400 text-sm mt-3">Verifying link...</p>
    </div>

    <!-- FORM -->
    <form id="resetForm" onsubmit="handleReset(event)" class="space-y-4 hidden">

      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">📧 Email</label>
        <input 
          type="email" 
          id="userEmail" 
          readonly
          class="input-dark w-full px-4 py-3 rounded-xl opacity-60">
      </div>

      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">🔒 New Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="newPass" 
            required 
            placeholder="Min 6 characters" 
            minlength="6"
            class="input-dark w-full px-4 py-3 rounded-xl pr-12">
          <button 
            type="button" 
            onclick="togglePass('newPass')" 
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-400 text-lg p-2">
            👁️
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-300 font-medium mb-2">🔒 Confirm Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="confirmPass" 
            required 
            placeholder="Re-enter password" 
            minlength="6"
            class="input-dark w-full px-4 py-3 rounded-xl pr-12">
          <button 
            type="button" 
            onclick="togglePass('confirmPass')" 
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-400 text-lg p-2">
            👁️
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="resetBtn" 
        class="w-full gold-gradient text-black font-bold py-3.5 rounded-xl text-base shadow-lg">
        🔐 Reset Password
      </button>

    </form>

    <!-- MESSAGE -->
    <p id="message" class="text-sm text-center mt-4 hidden"></p>

    <!-- BACK TO LOGIN -->
    <div class="mt-5 pt-5 border-t border-gold-500/20 text-center">
      <a href="login.html" class="text-gold-400 hover:text-gold-300 font-semibold text-sm">
        ← Back to Login
      </a>
    </div>

  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let oobCode = null;

// Toggle password visibility
window.togglePass = function(id) {
  const pass = document.getElementById(id);
  pass.type = pass.type === 'password' ? 'text' : 'password';
}

// Get oobCode from URL - supports multiple formats
const urlParams = new URLSearchParams(window.location.search);
oobCode = urlParams.get('oobCode');

// Check hash format as well
if (!oobCode && window.location.hash) {
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  oobCode = hashParams.get('oobCode');
}

// If Firebase redirects with full URL params - check for mode=resetPassword
if (!oobCode && window.location.href.includes('oobCode=')) {
  const match = window.location.href.match(/oobCode=([^&]+)/);
  if (match) oobCode = match[1];
}

// Verify the reset code
async function verifyCode() {
  const loadingBox = document.getElementById('loadingBox');
  const form = document.getElementById('resetForm');
  const msgEl = document.getElementById('message');

  if (!oobCode) {
    loadingBox.classList.add('hidden');
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = '❌ Invalid reset link. Please request a new one.';
    msgEl.classList.remove('hidden');
    return;
  }

  try {
    const email = await verifyPasswordResetCode(auth, oobCode);
    document.getElementById('userEmail').value = email;
    loadingBox.classList.add('hidden');
    form.classList.remove('hidden');
  } catch (err) {
    loadingBox.classList.add('hidden');
    let msg = '❌ ';
    if (err.code === 'auth/expired-action-code') msg += 'This reset link has expired. Please request a new one.';
    else if (err.code === 'auth/invalid-action-code') msg += 'This reset link is invalid or has already been used.';
    else if (err.code === 'auth/user-disabled') msg += 'This user account has been disabled.';
    else if (err.code === 'auth/user-not-found') msg += 'User not found.';
    else msg += err.message;
    
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = msg;
    msgEl.classList.remove('hidden');
  }
}

// Handle password reset
window.handleReset = async function(e) {
  e.preventDefault();
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const btn = document.getElementById('resetBtn');
  const msgEl = document.getElementById('message');

  msgEl.classList.add('hidden');

  if (newPass !== confirmPass) {
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = '❌ Passwords do not match';
    msgEl.classList.remove('hidden');
    return;
  }

  if (newPass.length < 6) {
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = '❌ Password must be at least 6 characters';
    msgEl.classList.remove('hidden');
    return;
  }

  btn.textContent = '⏳ Resetting...';
  btn.disabled = true;

  try {
    await confirmPasswordReset(auth, oobCode, newPass);
    
    msgEl.className = 'text-sm text-center mt-4 text-green-400';
    msgEl.textContent = '✅ Password reset successfully! Redirecting to login...';
    msgEl.classList.remove('hidden');
    btn.textContent = '✅ Success';
    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/expired-action-code') msg += 'Link expired. Request a new one.';
    else if (err.code === 'auth/invalid-action-code') msg += 'Invalid link';
    else if (err.code === 'auth/weak-password') msg += 'Password too weak';
    else msg += err.message;
    
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = msg;
    msgEl.classList.remove('hidden');
    btn.textContent = '🔐 Reset Password';
    btn.disabled = false;
  }
}

// Start verification
verifyCode();
</script>

</body>
</html>
