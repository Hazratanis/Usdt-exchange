<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' }
        },
        fontFamily: { 'display': ['Poppins','sans-serif'], 'body': ['Inter','sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; }
  h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%); }
  .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .black-card { background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%); border: 1px solid #2a2a2a; }
  .gold-glow { box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
  .input-dark { background: #0a0a0a; border: 2px solid #2a2a2a; color: white; }
  .input-dark:focus { border-color: #f59e0b; outline: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: blobFloat 8s ease-in-out infinite; pointer-events: none; }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-30px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} }
</style>
</head>
<body class="text-white flex items-center justify-center p-4 relative overflow-hidden">

<div class="blob bg-gold-500 w-80 h-80 top-0 -left-20"></div>
<div class="blob bg-yellow-500 w-80 h-80 bottom-0 -right-20" style="animation-delay: 2s;"></div>

<div class="w-full max-w-md relative z-10">
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center gap-3">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl shadow-lg gold-glow">💎</div>
    </a>
    <h1 class="text-2xl font-black text-white mt-4">Welcome Back</h1>
    <p class="text-gray-400 text-sm mt-1">Login to your account</p>
  </div>

  <div class="black-card rounded-3xl p-8">
    <form onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">📧 Email</label>
        <input type="email" id="loginEmail" required placeholder="your@email.com" 
               class="input-dark w-full px-5 py-4 rounded-xl text-base">
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">🔒 Password</label>
        <div class="relative">
          <input type="password" id="loginPass" required placeholder="••••••••" 
                 class="input-dark w-full px-5 py-4 rounded-xl text-base pr-12">
          <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-400">👁️</button>
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
          <input type="checkbox" class="accent-gold-500 w-4 h-4" checked>
          <span>Remember me</span>
        </label>
        <button type="button" onclick="openForgotModal()" class="text-gold-400 hover:text-gold-300 font-medium">Forgot password?</button>
      </div>

      <button type="submit" id="loginBtn" class="w-full gold-gradient text-black font-bold py-4 rounded-xl text-lg shadow-lg gold-glow hover:shadow-2xl transition">
        🚀 Login
      </button>
    </form>

    <p id="loginError" class="text-red-400 text-sm text-center mt-4 hidden"></p>

    <!-- DIVIDER -->
    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-gray-700"></div>
      <span class="text-gray-500 text-xs uppercase">OR</span>
      <div class="flex-1 h-px bg-gray-700"></div>
    </div>

    <!-- GOOGLE LOGIN -->
    <button onclick="loginWithGoogle()" id="googleBtn" class="w-full bg-white hover:bg-gray-100 text-gray-800 font-bold py-4 rounded-xl transition flex items-center justify-center gap-3 shadow-lg">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="mt-6 pt-6 border-t border-gold-500/20 text-center">
      <p class="text-gray-400 text-sm">Account nahi hai?</p>
      <a href="register.html" class="inline-block mt-2 text-gold-400 hover:text-gold-300 font-bold">
        Create Account →
      </a>
    </div>
  </div>

  <div class="text-center mt-6">
    <a href="index.html" class="text-gray-500 hover:text-gold-400 text-sm">← Back to Home</a>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgotModal" class="hidden fixed inset-0 z-[9999] bg-black/90 items-center justify-center p-4 backdrop-blur-lg">
  <div class="bg-gradient-to-br from-gray-900 to-black rounded-3xl p-8 max-w-md w-full border-2 border-gold-500/40 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">🔐</div>
      <h3 class="text-xl font-black text-white mb-2">Reset Password</h3>
      <p class="text-gray-400 text-sm">Apni email daalein — reset link bhejenge</p>
    </div>

    <form onsubmit="sendResetLink(event)" class="space-y-4">
      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">📧 Email</label>
        <input type="email" id="resetEmail" required placeholder="your@email.com" 
               class="input-dark w-full px-5 py-4 rounded-xl text-base">
      </div>

      <button type="submit" id="resetBtn" class="w-full gold-gradient text-black font-bold py-4 rounded-xl text-base shadow-lg gold-glow">
        📨 Send Reset Link
      </button>
    </form>

    <p id="resetMessage" class="text-sm text-center mt-4 hidden"></p>

    <button onclick="closeForgotModal()" class="w-full mt-4 bg-white/10 border-2 border-white/20 text-white font-bold py-3 rounded-xl hover:bg-white/20 transition text-sm">
      Cancel
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.togglePass = function() {
  const pass = document.getElementById('loginPass');
  pass.type = pass.type === 'password' ? 'text' : 'password';
}

window.handleLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  const remember = document.querySelector('input[type="checkbox"]').checked;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  btn.textContent = '⏳ Logging in...';
  btn.disabled = true;

  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = 'dashboard.html';
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/user-not-found') msg += 'Email not registered';
    else if (err.code === 'auth/wrong-password') msg += 'Wrong password';
    else if (err.code === 'auth/invalid-email') msg += 'Invalid email';
    else if (err.code === 'auth/invalid-credential') msg += 'Invalid email or password';
    else if (err.code === 'auth/too-many-requests') msg += 'Too many attempts. Try later.';
    else msg += err.message;
    
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = '🚀 Login';
    btn.disabled = false;
  }
}

window.loginWithGoogle = async function() {
  const btn = document.getElementById('googleBtn');
  const errEl = document.getElementById('loginError');
  
  errEl.classList.add('hidden');
  btn.textContent = '⏳ Signing in...';
  btn.disabled = true;

  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userDoc = await getDoc(doc(db, 'users', user.uid));
    
    if (!userDoc.exists()) {
      await setDoc(doc(db, 'users', user.uid), {
        name: user.displayName || 'User',
        email: user.email,
        phone: '',
        balance: 0,
        photoURL: user.photoURL || '',
        authProvider: 'google',
        createdAt: new Date().toISOString()
      });
    }

    window.location.href = 'dashboard.html';
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/popup-closed-by-user') msg += 'Login cancelled';
    else if (err.code === 'auth/popup-blocked') msg += 'Popup blocked';
    else msg += err.message;
    
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.innerHTML = 'Continue with Google';
    btn.disabled = false;
  }
}

window.openForgotModal = function() {
  const emailInput = document.getElementById('loginEmail').value;
  if (emailInput) {
    document.getElementById('resetEmail').value = emailInput;
  }
  document.getElementById('forgotModal').classList.remove('hidden');
  document.getElementById('forgotModal').classList.add('flex');
  document.body.style.overflow = 'hidden';
  document.getElementById('resetMessage').classList.add('hidden');
}

window.closeForgotModal = function() {
  document.getElementById('forgotModal').classList.add('hidden');
  document.getElementById('forgotModal').classList.remove('flex');
  document.body.style.overflow = '';
}

window.sendResetLink = async function(e) {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value;
  const btn = document.getElementById('resetBtn');
  const msgEl = document.getElementById('resetMessage');

  btn.textContent = '⏳ Sending...';
  btn.disabled = true;
  msgEl.classList.add('hidden');

  try {
    await sendPasswordResetEmail(auth, email);
    msgEl.className = 'text-sm text-center mt-4 text-green-400';
    msgEl.textContent = '✅ Reset link sent! Check your email (and spam folder).';
    msgEl.classList.remove('hidden');
    btn.textContent = '✅ Email Sent';
    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/user-not-found') msg += 'Email not registered';
    else if (err.code === 'auth/invalid-email') msg += 'Invalid email';
    else msg += err.message;
    
    msgEl.className = 'text-sm text-center mt-4 text-red-400';
    msgEl.textContent = msg;
    msgEl.classList.remove('hidden');
    btn.textContent = '📨 Send Reset Link';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
