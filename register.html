<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' }
        },
        fontFamily: { 'display': ['Poppins','sans-serif'], 'body': ['Inter','sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; }
  h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%); }
  .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .black-card { background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%); border: 1px solid #2a2a2a; }
  .gold-glow { box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
  .input-dark { background: #0a0a0a; border: 2px solid #2a2a2a; color: white; }
  .input-dark:focus { border-color: #f59e0b; outline: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: blobFloat 8s ease-in-out infinite; pointer-events: none; }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-30px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} }
</style>
</head>
<body class="text-white flex items-center justify-center p-4 relative overflow-hidden">

<div class="blob bg-gold-500 w-80 h-80 top-0 -left-20"></div>
<div class="blob bg-yellow-500 w-80 h-80 bottom-0 -right-20" style="animation-delay: 2s;"></div>

<div class="w-full max-w-md relative z-10 py-6">
  <div class="text-center mb-6">
    <a href="index.html" class="inline-flex items-center gap-3">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl shadow-lg gold-glow">💎</div>
    </a>
    <h1 class="text-2xl font-black text-white mt-4">Create Account</h1>
    <p class="text-gray-400 text-sm mt-1">Join USDT Exchange PK</p>
  </div>

  <div class="black-card rounded-3xl p-6">
    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">👤 Full Name *</label>
        <input type="text" id="regName" required placeholder="Muhammad Ali" 
               class="input-dark w-full px-5 py-3.5 rounded-xl text-base">
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">📧 Email *</label>
        <input type="email" id="regEmail" required placeholder="your@email.com" 
               class="input-dark w-full px-5 py-3.5 rounded-xl text-base">
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">📱 WhatsApp Number *</label>
        <input type="tel" id="regPhone" required placeholder="03XX-XXXXXXX" 
               class="input-dark w-full px-5 py-3.5 rounded-xl text-base">
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">🔒 Password *</label>
        <div class="relative">
          <input type="password" id="regPass" required placeholder="Min 6 characters" 
                 class="input-dark w-full px-5 py-3.5 rounded-xl text-base pr-12">
          <button type="button" onclick="togglePass('regPass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-400">👁️</button>
        </div>
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2 font-medium">🔒 Confirm Password *</label>
        <input type="password" id="regPass2" required placeholder="Re-enter password" 
               class="input-dark w-full px-5 py-3.5 rounded-xl text-base">
      </div>

      <div class="flex items-start gap-2 text-sm">
        <input type="checkbox" id="terms" required class="accent-gold-500 w-4 h-4 mt-1">
        <label for="terms" class="text-gray-400">
          Main <a href="#" class="text-gold-400 hover:text-gold-300">Terms & Conditions</a> aur <a href="#" class="text-gold-400 hover:text-gold-300">Privacy Policy</a> se agree karta hoon
        </label>
      </div>

      <button type="submit" id="registerBtn" class="w-full gold-gradient text-black font-bold py-4 rounded-xl text-lg shadow-lg gold-glow hover:shadow-2xl transition">
        ✨ Create Account
      </button>
    </form>

    <p id="registerError" class="text-red-400 text-sm text-center mt-4 hidden"></p>

    <div class="mt-5 pt-5 border-t border-gold-500/20 text-center">
      <p class="text-gray-400 text-sm">Already have an account?</p>
      <a href="login.html" class="inline-block mt-2 text-gold-400 hover:text-gold-300 font-bold">
        Login →
      </a>
    </div>
  </div>

  <div class="text-center mt-6">
    <a href="index.html" class="text-gray-500 hover:text-gold-400 text-sm">← Back to Home</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPFC3gtvKQxmlddLpabMYx6IZe0B0I9zE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.togglePass = function(id) {
  const pass = document.getElementById(id);
  pass.type = pass.type === 'password' ? 'text' : 'password';
}

window.handleRegister = async function(e) {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const phone = document.getElementById('regPhone').value;
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  const errEl = document.getElementById('registerError');
  const btn = document.getElementById('registerBtn');

  errEl.classList.add('hidden');

  if (pass !== pass2) {
    errEl.textContent = '❌ Passwords match nahi karte';
    errEl.classList.remove('hidden');
    return;
  }

  if (pass.length < 6) {
    errEl.textContent = '❌ Password kam se kam 6 characters ka ho';
    errEl.classList.remove('hidden');
    return;
  }

  btn.textContent = '⏳ Creating account...';
  btn.disabled = true;

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
    const user = userCredential.user;

    await updateProfile(user, { displayName: name });

    await setDoc(doc(db, 'users', user.uid), {
      name: name,
      email: email,
      phone: phone,
      balance: 0,
      createdAt: new Date().toISOString()
    });

    window.location.href = 'dashboard.html';
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/email-already-in-use') msg += 'Yeh email pehle se registered hai. Login karein.';
    else if (err.code === 'auth/invalid-email') msg += 'Email sahi nahi hai';
    else if (err.code === 'auth/weak-password') msg += 'Password kamzor hai (6+ characters)';
    else msg += err.message;
    
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = '✨ Create Account';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
