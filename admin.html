<!DOCTYPE html>
<html lang="en" class="dark">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
          'dark': { 900:'#09090b', 800:'#18181b', 700:'#27272a', 600:'#3f3f46' }

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #09090b; color: #e4e4e7; min-height: 100vh; }
  h1,h2,h3,h4,.font-display { font-family: 'Poppins', sans-serif; }
  
  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Premium Gradients & Cards */
  .gold-gradient { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); }
  .gold-text { background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 50%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .glass-card { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(63, 63, 70, 0.5); }
  .solid-card { background: #18181b; border: 1px solid #27272a; transition: border-color 0.2s; }
  .solid-card:hover { border-color: rgba(245, 158, 11, 0.3); }
  
  /* Inputs */
  .input-dark { background: #09090b; border: 1px solid #27272a; color: #f4f4f5; transition: all 0.2s; }
  .input-dark:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); outline: none; }
  
  /* Status Badges */
  .status-badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  
  .status-pending { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
  .status-pending::before { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  
  .status-completed { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
  .status-completed::before { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  
  .status-rejected { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
  .status-rejected::before { background: #f87171; box-shadow: 0 0 8px #f87171; }
  
  .status-processing { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
  .status-processing::before { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }

  /* Loader */
  .loader { border: 3px solid rgba(245,158,11,0.2); border-radius: 50%; border-top-color: #f59e0b; width: 24px; height: 24px; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allOrders = [];
let allUsers = [];
let currentStatusFilter = 'all';

// AUTH
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
    if (adminDoc.exists()) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminEmailDisplay').textContent = user.email;
      loadAllData();
    } else {
      await signOut(auth);
      const errEl = document.getElementById('adminError');
      errEl.textContent = 'Unauthorized access. Admins only.';
      errEl.classList.remove('hidden');
    }
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
  }
});

window.adminLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const errEl = document.getElementById('adminError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  btn.innerHTML = '<span class="loader border-black border-t-transparent w-5 h-5 mx-auto"></span>';
  btn.disabled = true;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    let msg = 'Authentication failed';
    if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
      msg = 'Invalid email or password';
    } else { msg = err.message; }
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = 'Secure Login';
    btn.disabled = false;
  }
}

window.adminLogout = async function() {
  await signOut(auth);
  window.location.reload();
}

window.loadAllData = async function() {
  await Promise.all([loadOrders(), loadUsers()]);
  updateBadges();
}

// TABS
window.showTab = function(tab) {
  // Reset all tabs
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = b.className.replace('bg-dark-800 text-gold-400 border-gold-500', 'text-gray-400 hover:text-gray-200 border-transparent hover:bg-dark-800/50');
    // Adjust inner badges
    let badge = b.querySelector('span');
    if(badge) badge.className = badge.className.replace('bg-gold-500 text-black', 'bg-dark-700 text-gray-300');
  });
  
  // Set Active tab
  let currentBtn = event.currentTarget;
  currentBtn.className = currentBtn.className.replace('text-gray-400 hover:text-gray-200 border-transparent hover:bg-dark-800/50', 'bg-dark-800 text-gold-400 border-gold-500');
  let currentBadge = currentBtn.querySelector('span');
  if(currentBadge) currentBadge.className = currentBadge.className.replace('bg-dark-700 text-gray-300', 'bg-gold-500 text-black');

  // Show/Hide Content
  ['ordersTab', 'usersTab', 'statsTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
  
  if (tab === 'orders') document.getElementById('ordersTab').classList.remove('hidden');
  else if (tab === 'users') document.getElementById('usersTab').classList.remove('hidden');
  else if (tab === 'stats') { document.getElementById('statsTab').classList.remove('hidden'); loadStats(); }
}

// LOAD ORDERS
window.loadOrders = async function() {
  try {
    const snap = await getDocs(collection(db, 'orders'));
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderOrders();
  } catch (err) {
    console.error(err);
    document.getElementById('ordersContainer').innerHTML = '<div class="col-span-full py-10 text-center text-red-400 bg-red-500/10 rounded-xl border border-red-500/20">Failed to load orders. Please refresh.</div>';
  }
}

window.filterOrders = function(status, btn) {
  currentStatusFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = b.className.replace('bg-dark-700 text-white shadow-sm', 'text-gray-400 hover:text-white');
  });
  btn.className = btn.className.replace('text-gray-400 hover:text-white', 'bg-dark-700 text-white shadow-sm');
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById('ordersContainer');
  const search = (document.getElementById('orderSearch')?.value || '').toLowerCase();

  let filtered = allOrders;
  if (currentStatusFilter !== 'all') filtered = filtered.filter(o => o.status === currentStatusFilter);
  
  if (search) {
    filtered = filtered.filter(o => 
      (o.customerName || o.senderName || o.receiverName || '').toLowerCase().includes(search) ||
      (o.customerPhone || o.receiverPhone || '').includes(search) ||
      (o.id || '').toLowerCase().includes(search) ||
      (o.trxId || '').toLowerCase().includes(search)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="col-span-full py-20 flex flex-col items-center justify-center text-gray-500 border border-dashed border-dark-700 rounded-3xl">
        <div class="text-4xl mb-4 opacity-50">📭</div>
        <p class="font-medium">No orders found matching criteria.</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(order => {
    const isSell = order.type === 'Sell';
    const accentColor = isSell ? 'orange-500' : 'green-500';
    const accentText = isSell ? 'text-orange-400' : 'text-green-400';
    const accentBg = isSell ? 'bg-orange-500/10' : 'bg-green-500/10';

    const screenshotHtml = order.screenshot 
      ? `<div class="mt-4 relative group cursor-pointer overflow-hidden rounded-xl border border-dark-700" onclick="viewImage('${order.id}')">
          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white text-sm font-medium z-10 backdrop-blur-sm">View Receipt</div>
          <img src="${order.screenshot}" class="w-full h-32 object-cover opacity-80 group-hover:opacity-100 transition-all group-hover:scale-105">
         </div>`
      : `<div class="mt-4 p-3 bg-dark-800 border border-dark-700 rounded-xl text-xs text-gray-500 flex items-center gap-2"><span class="text-yellow-500/70">⚠️</span> No payment proof attached</div>`;

    let details = '';
    if (!isSell) {
      details = `
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Sender:</span> <span class="font-medium text-white text-right break-words max-w-[60%]">${order.senderName || 'N/A'}</span></div>
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Sent (PKR):</span> <span class="font-medium text-white">Rs. ${order.amountSent || 0}</span></div>
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Platform:</span> <span class="font-medium text-white">${order.receiveMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${order.binanceUid ? `<div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Binance UID:</span> <span class="font-mono text-white text-[11px] truncate ml-2" title="${order.binanceUid}">${order.binanceUid}</span></div>` : ''}
        ${order.binanceName ? `<div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">B. Name:</span> <span class="font-medium text-white text-right max-w-[60%] truncate">${order.binanceName}</span></div>` : ''}
        ${order.walletAddress ? `<div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Wallet:</span> <span class="font-mono text-white text-[11px] truncate ml-2" title="${order.walletAddress}">${order.walletAddress}</span></div>` : ''}
      `;
    } else {
      details = `
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Sent (USDT):</span> <span class="font-medium text-white">${order.amountSentUsdt || 0} USDT</span></div>
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Receive in:</span> <span class="font-medium text-white">${order.paymentMethod || 'N/A'}</span></div>
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Platform:</span> <span class="font-medium text-white">${order.senderMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${order.senderBinanceUid ? `<div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Sender UID:</span> <span class="font-mono text-white text-[11px] truncate ml-2" title="${order.senderBinanceUid}">${order.senderBinanceUid}</span></div>` : ''}
        ${order.senderWalletAddress ? `<div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Wallet:</span> <span class="font-mono text-white text-[11px] truncate ml-2" title="${order.senderWalletAddress}">${order.senderWalletAddress}</span></div>` : ''}
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Receiver:</span> <span class="font-medium text-white truncate max-w-[60%]">${order.receiverName || 'N/A'}</span></div>
        <div class="flex justify-between items-center py-1 border-b border-dark-800"><span class="text-gray-500">Phone:</span> <span class="font-mono text-white">${order.receiverPhone || 'N/A'}</span></div>
      `;
    }

    const primaryVal = isSell ? `${order.usdtAmount || 0} USDT` : `Rs. ${order.pkrAmount || 0}`;
    const secondaryVal = isSell ? `Rs. ${order.pkrAmount || 0}` : `${order.usdtAmount || 0} USDT`;
    const formattedDate = order.date ? order.date : 'Unknown Date';

    return `
    <div class="solid-card rounded-2xl flex flex-col overflow-hidden relative group">
      <!-- Top Colored Accent Bar -->
      <div class="h-1 w-full bg-gradient-to-r from-${accentColor}/50 to-transparent"></div>
      
      <div class="p-5 flex-1 flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-start mb-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${accentBg} ${accentText}">${order.type || 'Buy'}</span>
              <span class="text-xs text-gray-500 font-mono">#${order.id.substring(0,8).toUpperCase()}</span>
            </div>
            <p class="text-xs text-gray-400">${formattedDate}</p>
          </div>
          <span class="status-badge ${getStatusClass(order.status)}">${order.status || 'Pending'}</span>
        </div>
        
        <!-- Big Amounts -->
        <div class="bg-dark-800/50 rounded-xl p-3 mb-4 flex items-center justify-between border border-dark-700/50">
           <div>
             <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">${isSell ? 'Giving' : 'Paying'}</p>
             <p class="font-display font-bold ${accentText} text-lg leading-none">${primaryVal}</p>
           </div>
           <div class="text-gray-600 text-lg">⇄</div>
           <div class="text-right">
             <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">${isSell ? 'Receiving' : 'Getting'}</p>
             <p class="font-display font-bold text-white text-lg leading-none">${secondaryVal}</p>
           </div>
        </div>

        <!-- Details Grid -->
        <div class="text-[12px] flex flex-col gap-1 flex-1">
          ${details}
          <div class="flex justify-between items-center py-1 mt-1"><span class="text-gray-500">TRX ID:</span> <span class="font-mono text-white text-[11px] truncate ml-2 bg-dark-800 px-1.5 py-0.5 rounded border border-dark-700" title="${order.trxId || 'N/A'}">${order.trxId || 'N/A'}</span></div>
        </div>

        ${screenshotHtml}
      </div>

      <!-- Action Buttons -->
      <div class="p-3 bg-dark-800/80 border-t border-dark-700 grid grid-cols-3 gap-2 mt-auto">
        <button onclick="updateStatus('${order.id}', 'Processing')" class="py-2.5 rounded-lg text-xs font-semibold bg-dark-700 hover:bg-blue-500/10 hover:text-blue-400 text-gray-400 border border-transparent hover:border-blue-500/30 transition-all flex justify-center items-center gap-1"><span class="text-sm">🔄</span> Process</button>
        <button onclick="updateStatus('${order.id}', 'Completed')" class="py-2.5 rounded-lg text-xs font-semibold bg-dark-700 hover:bg-green-500/10 hover:text-green-400 text-gray-400 border border-transparent hover:border-green-500/30 transition-all flex justify-center items-center gap-1"><span class="text-sm">✅</span> Done</button>
        <button onclick="updateStatus('${order.id}', 'Rejected')" class="py-2.5 rounded-lg text-xs font-semibold bg-dark-700 hover:bg-red-500/10 hover:text-red-400 text-gray-400 border border-transparent hover:border-red-500/30 transition-all flex justify-center items-center gap-1"><span class="text-sm">❌</span> Reject</button>
      </div>
    </div>
    `;
  }).join('');
}

// LOAD USERS
window.loadUsers = async function() {
  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    allUsers.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    renderUsers();
  } catch (err) {
    console.error(err);
  }
}

function renderUsers() {
  const container = document.getElementById('usersContainer');
  const search = (document.getElementById('userSearch')?.value || '').toLowerCase();

  let filtered = allUsers;
  if (search) {
    filtered = filtered.filter(u => 
      (u.name || '').toLowerCase().includes(search) ||
      (u.email || '').toLowerCase().includes(search) ||
      (u.phone || '').includes(search)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `<div class="col-span-full py-16 text-center text-gray-500">No users found.</div>`;
    return;
  }

  container.innerHTML = filtered.map(user => {
    const initial = (user.name || user.email || 'U').charAt(0).toUpperCase();
    const joined = user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-PK', {year:'numeric', month:'short', day:'numeric'}) : 'Unknown';
    
    return `
    <div class="solid-card rounded-2xl p-5 flex items-center gap-4 hover:shadow-lg transition-all group">
      <div class="w-12 h-12 bg-dark-700 rounded-full flex items-center justify-center text-white font-display font-bold text-lg group-hover:bg-gold-500/20 group-hover:text-gold-400 transition-colors flex-shrink-0">
        ${initial}
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="font-display font-semibold text-white text-sm truncate">${user.name || 'Anonymous User'}</h4>
        <p class="text-xs text-gray-400 truncate mb-1">${user.email || 'No email'}</p>
        <div class="flex gap-3 text-[11px] text-gray-500 font-medium">
          <span class="flex items-center gap-1">💰 <span class="text-gold-400">Rs. ${user.balance || 0}</span></span>
          <span class="flex items-center gap-1">📅 ${joined}</span>
        </div>
      </div>
      <button onclick="openUserModal('${user.uid}')" class="w-9 h-9 flex items-center justify-center rounded-full bg-dark-700 hover:bg-gold-500 text-gray-400 hover:text-black transition-colors flex-shrink-0">
        →
      </button>
    </div>
  `}).join('');
}

// USER MODAL
window.openUserModal = function(uid) {
  const user = allUsers.find(u => u.uid === uid);
  if (!user) return;

  const orders = allOrders.filter(o => o.userId === uid);
  const completedOrders = orders.filter(o => o.status === 'Completed').length;
  const initial = (user.name || user.email || 'U').charAt(0).toUpperCase();

  document.getElementById('userModalContent').innerHTML = `
    <div class="flex flex-col items-center mb-6">
      <div class="w-20 h-20 bg-dark-700 rounded-full flex items-center justify-center text-white font-display font-bold text-3xl mb-4 border-4 border-dark-800 shadow-xl">
        ${initial}
      </div>
      <h2 class="font-display font-bold text-xl text-white">${user.name || 'Anonymous'}</h2>
      <p class="text-sm text-gray-400">${user.email || 'N/A'}</p>
      <span class="mt-2 px-3 py-1 bg-dark-800 rounded-full text-xs text-gray-300 font-mono">ID: ${user.uid.substring(0,8)}...</span>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-dark-800 p-4 rounded-xl border border-dark-700">
        <p class="text-[10px] uppercase text-gray-500 font-semibold mb-1">Current Balance</p>
        <p class="font-display font-bold text-gold-400 text-lg">Rs. ${user.balance || 0}</p>
      </div>
      <div class="bg-dark-800 p-4 rounded-xl border border-dark-700">
        <p class="text-[10px] uppercase text-gray-500 font-semibold mb-1">Phone Number</p>
        <p class="font-mono text-white text-sm mt-1">${user.phone || 'Not provided'}</p>
      </div>
      <div class="bg-dark-800 p-4 rounded-xl border border-dark-700">
        <p class="text-[10px] uppercase text-gray-500 font-semibold mb-1">Total Orders</p>
        <p class="font-display font-bold text-white text-lg">${orders.length}</p>
      </div>
      <div class="bg-dark-800 p-4 rounded-xl border border-dark-700">
        <p class="text-[10px] uppercase text-gray-500 font-semibold mb-1">Successful</p>
        <p class="font-display font-bold text-green-400 text-lg">${completedOrders}</p>
      </div>
    </div>

    <div class="space-y-3">
      <button onclick="updateUserBalance('${user.uid}', ${user.balance || 0})" class="w-full bg-gold-500 hover:bg-gold-400 text-black py-3 rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2">
        <span>💰</span> Edit Balance
      </button>
      <button onclick="resetUserPassword('${user.email}')" class="w-full bg-dark-800 hover:bg-dark-700 border border-dark-600 text-white py-3 rounded-xl text-sm font-medium transition-colors flex items-center justify-center gap-2">
        <span>🔑</span> Send Reset Password Link
      </button>
      <button onclick="deleteUser('${user.uid}', '${user.email}')" class="w-full bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 py-3 rounded-xl text-sm font-medium transition-colors flex items-center justify-center gap-2 mt-4">
        <span>🗑️</span> Delete User Account
      </button>
    </div>
  `;

  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('userModal').classList.remove('hidden');
}

window.closeUserModal = function() {
  document.getElementById('userModal').classList.add('hidden');
  document.getElementById('modalOverlay').classList.add('hidden');
}

window.resetUserPassword = async function(email) {
  try {
    await sendPasswordResetEmail(auth, email);
    alert('✅ Password reset link sent to: ' + email);
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

window.updateUserBalance = async function(uid, currentBalance) {
  const newBalance = prompt('Enter new balance in PKR:', currentBalance);
  if (newBalance === null) return;
  const parsed = parseFloat(newBalance);
  if (isNaN(parsed) || parsed < 0) {
    alert('❌ Invalid amount entered.');
    return;
  }
  try {
    await updateDoc(doc(db, 'users', uid), { balance: parsed });
    alert('✅ Balance successfully updated to Rs. ' + parsed);
    await loadUsers();
    closeUserModal();
  } catch (err) {
    alert('❌ Update failed: ' + err.message);
  }
}

window.deleteUser = async function(uid, email) {
  if (!confirm(`Are you sure you want to delete ${email}?\nThis action cannot be undone.`)) return;
  try {
    await deleteDoc(doc(db, 'users', uid));
    alert('✅ User data removed from Firestore.\nNote: Auth account needs deletion from Firebase Console.');
    await loadUsers();
    closeUserModal();
  } catch (err) {
    alert('❌ Deletion failed: ' + err.message);
  }
}

// UPDATE STATUS
window.updateStatus = async function(orderId, newStatus) {
  if (!confirm(`Change order status to "${newStatus}"?`)) return;
  try {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
    await loadOrders();
    updateBadges();
  } catch (err) {
    alert('❌ Update failed: ' + err.message);
  }
}

// IMAGE VIEWER
window.viewImage = function(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (order && order.screenshot) {
    document.getElementById('viewImage').src = order.screenshot;
    document.getElementById('modalOverlay').classList.remove('hidden');
    document.getElementById('imageModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
}

window.closeImage = function() {
  document.getElementById('imageModal').classList.add('hidden');
  document.getElementById('modalOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

// HELPERS
function getStatusClass(status) {
  if (status === 'Completed') return 'status-completed';
  if (status === 'Rejected') return 'status-rejected';
  if (status === 'Processing') return 'status-processing';
  return 'status-pending';
}

function updateBadges() {
  document.getElementById('badgeOrders').textContent = allOrders.length;
  document.getElementById('badgeUsers').textContent = allUsers.length;
  document.getElementById('fAll').textContent = allOrders.length;
  document.getElementById('fPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('fProcessing').textContent = allOrders.filter(o => o.status === 'Processing').length;
  document.getElementById('fCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('fRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
}

function loadStats() {
  document.getElementById('statUsers').textContent = allUsers.length;
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statBuy').textContent = allOrders.filter(o => o.type === 'Buy').length;
  document.getElementById('statSell').textContent = allOrders.filter(o => o.type === 'Sell').length;
  document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('statCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('statRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
  const totalUsdt = allOrders.filter(o => o.status === 'Completed').reduce((s, o) => s + (parseFloat(o.usdtAmount) || 0), 0);
  document.getElementById('statUsdt').textContent = totalUsdt.toFixed(2);
}
</script>

</body>
</html>
