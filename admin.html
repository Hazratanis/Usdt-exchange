import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allOrders = [];
let allUsers = [];
let currentStatusFilter = 'all';
let ordersUnsubscribe = null;
let lastOrderCount = 0;
let isFirstLoad = true;
let notificationsEnabled = false;

// ============ SERVICE WORKER REGISTER ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then((reg) => console.log('✅ SW registered:', reg.scope))
    .catch((err) => console.error('❌ SW failed:', err));
}

// ============ AUTH ============
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
    if (adminDoc.exists()) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminEmailDisplay').textContent = user.email;
      loadAllData();
      startOrderListener();
    } else {
      await signOut(auth);
      const errEl = document.getElementById('adminError');
      errEl.textContent = '❌ You are not authorized as admin';
      errEl.classList.remove('hidden');
    }
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    if (ordersUnsubscribe) ordersUnsubscribe();
  }
});

window.adminLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const errEl = document.getElementById('adminError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  btn.textContent = '⏳ Logging in...';
  btn.disabled = true;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/user-not-found') msg += 'Email not registered';
    else if (err.code === 'auth/wrong-password') msg += 'Wrong password';
    else if (err.code === 'auth/invalid-credential') msg += 'Invalid email or password';
    else msg += err.message;
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = '🚀 Login';
    btn.disabled = false;
  }
}

window.adminLogout = async function() {
  if (ordersUnsubscribe) ordersUnsubscribe();
  await signOut(auth);
  window.location.reload();
}

// ============ NOTIFICATION PERMISSION ============
window.enableNotifications = async function() {
  if (!('Notification' in window)) {
    alert('❌ This browser does not support notifications');
    return;
  }

  if (Notification.permission === 'granted') {
    notificationsEnabled = true;
    document.getElementById('notifBtn').style.background = 'rgba(34, 197, 94, 0.2)';
    document.getElementById('notifBtn').style.borderColor = 'rgba(34, 197, 94, 0.4)';
    
    // Test notification via Service Worker
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification('✅ Notifications Active', {
        body: 'You will receive alerts for new orders.',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💎</text></svg>'
      });
    } catch (e) {
      alert('✅ Notifications already enabled');
    }
    return;
  }

  const permission = await Notification.requestPermission();
  if (permission === 'granted') {
    notificationsEnabled = true;
    document.getElementById('notifBtn').style.background = 'rgba(34, 197, 94, 0.2)';
    document.getElementById('notifBtn').style.borderColor = 'rgba(34, 197, 94, 0.4)';
    
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification('✅ Notifications Enabled', {
        body: 'You will now receive alerts for new orders.',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💎</text></svg>'
      });
    } catch (e) {
      alert('✅ Notifications enabled!');
    }
  } else {
    alert('❌ Notification permission denied. Please enable from browser settings.');
  }
}

// Check permission on load
if ('Notification' in window && Notification.permission === 'granted') {
  notificationsEnabled = true;
  setTimeout(() => {
    const btn = document.getElementById('notifBtn');
    if (btn) {
      btn.style.background = 'rgba(34, 197, 94, 0.2)';
      btn.style.borderColor = 'rgba(34, 197, 94, 0.4)';
    }
  }, 500);
}

// ============ REAL-TIME ORDER LISTENER ============
function startOrderListener() {
  const ordersQuery = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
  
  ordersUnsubscribe = onSnapshot(ordersQuery, (snapshot) => {
    const currentCount = snapshot.size;
    
    if (isFirstLoad) {
      lastOrderCount = currentCount;
      isFirstLoad = false;
      return;
    }
    
    if (currentCount > lastOrderCount) {
      const newOrdersCount = currentCount - lastOrderCount;
      const newOrders = snapshot.docs.slice(0, newOrdersCount);
      
      newOrders.forEach(docSnap => {
        const order = docSnap.data();
        showNewOrderAlert(order);
      });
      
      loadOrders();
    }
    
    lastOrderCount = currentCount;
  }, (error) => {
    console.error('Order listener error:', error);
  });
}

// ============ NEW ORDER ALERT ============
async function showNewOrderAlert(order) {
  const orderType = order.type === 'Sell' ? 'SELL' : 'BUY';
  const amount = order.type === 'Sell' 
    ? `${order.usdtAmount || 0} USDT` 
    : `Rs. ${order.pkrAmount || 0}`;
  
  const customerName = order.customerName || order.senderName || order.receiverName || 'Customer';
  const phone = order.customerPhone || order.receiverPhone || 'N/A';
  
  const title = `🔔 New ${orderType} Order!`;
  const body = `👤 ${customerName}\n💰 ${amount}\n📱 ${phone}`;
  
  // 1. Play sound
  playNotificationSound();
  
  // 2. Service Worker Notification (reliable on Android)
  if (notificationsEnabled && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body: body,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💎</text></svg>',
        badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>',
        vibrate: [200, 100, 200],
        tag: 'new-order-' + Date.now(),
        requireInteraction: true,
        renotify: true,
        silent: false
      });
    } catch (err) {
      console.error('SW notification error:', err);
      try {
        new Notification(title, {
          body: body,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💎</text></svg>'
        });
      } catch (e) {
        console.error('Fallback notification error:', e);
      }
    }
  }
  
  // 3. In-app toast
  showInAppToast(title, body);
}

// ============ SOUND ============
function playNotificationSound() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    const beep = (freq, delay) => {
      setTimeout(() => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        osc.start(audioContext.currentTime);
        osc.stop(audioContext.currentTime + 0.3);
      }, delay);
    };
    
    beep(800, 0);
    beep(1000, 250);
    beep(1200, 500);
  } catch (err) {
    console.log('Sound error:', err);
  }
}

// ============ IN-APP TOAST ============
function showInAppToast(title, body) {
  const existingToast = document.getElementById('orderToast');
  if (existingToast) existingToast.remove();
  
  const toast = document.createElement('div');
  toast.id = 'orderToast';
  toast.style.cssText = `
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: black;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(245, 158, 11, 0.5);
    z-index: 99999;
    max-width: 90%;
    width: 340px;
    opacity: 0;
    transition: all 0.4s ease;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  `;
  
  toast.innerHTML = `
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="font-size: 32px;">🔔</div>
      <div style="flex: 1;">
        <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${title}</div>
        <div style="font-size: 12px; white-space: pre-line; line-height: 1.4;">${body}</div>
      </div>
      <button onclick="event.stopPropagation(); this.parentElement.parentElement.remove()" style="background: rgba(0,0,0,0.2); border: none; color: black; width: 24px; height: 24px; border-radius: 50%; font-size: 16px; cursor: pointer;">✕</button>
    </div>
  `;
  
  toast.onclick = function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast.remove();
  };
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.transform = 'translateX(-50%) translateY(0)';
    toast.style.opacity = '1';
  }, 100);
  
  setTimeout(() => {
    if (toast.parentElement) {
      toast.style.transform = 'translateX(-50%) translateY(-100px)';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 400);
    }
  }, 15000);
}

}

window.showTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = b.className.replace('bg-gold-500 text-black', 'bg-gray-900 text-gray-300 border border-gold-500/20');
  });
  event.target.className = event.target.className.replace('bg-gray-900 text-gray-300 border border-gold-500/20', 'bg-gold-500 text-black');

  document.getElementById('ordersTab').classList.add('hidden');
  document.getElementById('usersTab').classList.add('hidden');
  document.getElementById('statsTab').classList.add('hidden');

  if (tab === 'orders') document.getElementById('ordersTab').classList.remove('hidden');
  else if (tab === 'users') document.getElementById('usersTab').classList.remove('hidden');
  else if (tab === 'stats') { document.getElementById('statsTab').classList.remove('hidden'); loadStats(); }
}

window.loadOrders = async function() {
  try {
    const snap = await getDocs(collection(db, 'orders'));
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderOrders();
    updateBadges();
  } catch (err) {
    console.error(err);
    document.getElementById('ordersContainer').innerHTML = '<p class="text-center text-red-400 py-8 text-sm">Failed to load orders</p>';
  }
}

window.filterOrders = function(status, btn) {
  currentStatusFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = b.className.replace('bg-gold-500 text-black', 'bg-gray-900 text-gray-300 border border-gray-700');
  });
  btn.className = btn.className.replace('bg-gray-900 text-gray-300 border border-gray-700', 'bg-gold-500 text-black');
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById('ordersContainer');
  const search = (document.getElementById('orderSearch')?.value || '').toLowerCase();

  let filtered = allOrders;
  if (currentStatusFilter !== 'all') filtered = filtered.filter(o => o.status === currentStatusFilter);
  
  if (search) {
    filtered = filtered.filter(o => 
      (o.customerName || o.senderName || o.receiverName || '').toLowerCase().includes(search) ||
      (o.customerPhone || o.receiverPhone || '').includes(search) ||
      (o.id || '').toLowerCase().includes(search) ||
      (o.trxId || '').toLowerCase().includes(search)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="black-card rounded-2xl p-8 text-center">
        <div class="text-5xl mb-3">📭</div>
        <p class="text-gray-400 text-sm">No orders found</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(order => {
    const isSell = order.type === 'Sell';
    const borderColor = isSell ? 'border-orange-500' : 'border-green-500';
    const typeEmoji = isSell ? '💵' : '💰';
    const typeColor = isSell ? 'text-orange-400' : 'text-green-400';

    const screenshotHtml = order.screenshot 
      ? `<img src="${order.screenshot}" onclick="viewImage('${order.id}')" class="w-full max-h-48 object-contain rounded-lg border border-gold-500/30 cursor-pointer mb-2">`
      : `<div class="mb-2 p-2 bg-yellow-900/20 border border-yellow-500/30 rounded-lg text-xs text-yellow-400">⚠️ No screenshot</div>`;

    let details = '';
    if (!isSell) {
      details = `
        <div><span class="text-gray-500">Sender:</span> <span class="text-white">${order.senderName || 'N/A'}</span></div>
        <div><span class="text-gray-500">Amount Sent:</span> <span class="text-white">Rs. ${order.amountSent || 0}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Receive:</span> <span class="text-white">${order.receiveMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${order.binanceUid ? `<div class="col-span-2"><span class="text-gray-500">Binance UID:</span> <span class="text-white break-all">${order.binanceUid}</span></div>` : ''}
        ${order.binanceName ? `<div class="col-span-2"><span class="text-gray-500">Binance Name:</span> <span class="text-white">${order.binanceName}</span></div>` : ''}
        ${order.walletAddress ? `<div class="col-span-2"><span class="text-gray-500">Wallet:</span> <span class="text-white break-all">${order.walletAddress}</span></div>` : ''}
      `;
    } else {
      details = `
        <div><span class="text-gray-500">Amount Sent:</span> <span class="text-white">${order.amountSentUsdt || 0} USDT</span></div>
        <div><span class="text-gray-500">Payment:</span> <span class="text-white">${order.paymentMethod || 'N/A'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Sender Method:</span> <span class="text-white">${order.senderMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${order.senderBinanceUid ? `<div class="col-span-2"><span class="text-gray-500">Sender UID:</span> <span class="text-white break-all">${order.senderBinanceUid}</span></div>` : ''}
        ${order.senderWalletAddress ? `<div class="col-span-2"><span class="text-gray-500">Sender Wallet:</span> <span class="text-white break-all">${order.senderWalletAddress}</span></div>` : ''}
        <div><span class="text-gray-500">Receiver:</span> <span class="text-white">${order.receiverName || 'N/A'}</span></div>
        <div><span class="text-gray-500">Receiver No:</span> <span class="text-white">${order.receiverPhone || 'N/A'}</span></div>
      `;
    }

    const primary = isSell ? `${order.usdtAmount || 0} USDT` : `Rs. ${order.pkrAmount || 0}`;
    const secondary = isSell ? `Rs. ${order.pkrAmount || 0}` : `${order.usdtAmount || 0} USDT`;

    return `
    <div class="black-card rounded-2xl p-4 mb-3 border-l-4 ${borderColor}">
      <div class="flex justify-between items-start mb-3">
        <div>
          <p class="font-bold text-white text-sm">${typeEmoji} ${order.type || 'Buy'} USDT</p>
          <p class="text-gray-500 text-xs mt-0.5">#${order.id.substring(0,10).toUpperCase()}</p>
        </div>
        <span class="text-xs px-3 py-1 rounded-full font-semibold ${getStatusClass(order.status)}">${order.status || 'Pending'}</span>
      </div>
      
      <div class="grid grid-cols-2 gap-2 text-xs mb-3">
        <div><span class="text-gray-500">${isSell ? 'USDT' : 'PKR'}:</span> <span class="${typeColor} font-bold">${primary}</span></div>
        <div><span class="text-gray-500">${isSell ? 'PKR' : 'USDT'}:</span> <span class="text-white font-bold">${secondary}</span></div>
        ${details}
        <div class="col-span-2"><span class="text-gray-500">Email:</span> <span class="text-white break-all">${order.userEmail || 'N/A'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">TRX:</span> <span class="text-white break-all">${order.trxId || 'N/A'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Date:</span> <span class="text-white">${order.date || 'N/A'}</span></div>
      </div>

      ${screenshotHtml}

      <div class="flex gap-2 mt-2">
        <button onclick="updateStatus('${order.id}', 'Processing')" class="flex-1 bg-blue-500/20 border border-blue-500/40 text-blue-400 py-2 rounded-lg text-xs font-semibold">🔄 Processing</button>
        <button onclick="updateStatus('${order.id}', 'Completed')" class="flex-1 bg-green-500/20 border border-green-500/40 text-green-400 py-2 rounded-lg text-xs font-semibold">✓ Complete</button>
        <button onclick="updateStatus('${order.id}', 'Rejected')" class="flex-1 bg-red-500/20 border border-red-500/40 text-red-400 py-2 rounded-lg text-xs font-semibold">✕ Reject</button>
      </div>
    </div>
    `;
  }).join('');
}

window.loadUsers = async function() {
  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    allUsers.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    renderUsers();
  } catch (err) {
    console.error(err);
  }
}

function renderUsers() {
  const container = document.getElementById('usersContainer');
  const search = (document.getElementById('userSearch')?.value || '').toLowerCase();

  let filtered = allUsers;
  if (search) {
    filtered = filtered.filter(u => 
      (u.name || '').toLowerCase().includes(search) ||
      (u.email || '').toLowerCase().includes(search) ||
      (u.phone || '').includes(search)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="black-card rounded-2xl p-8 text-center">
        <div class="text-5xl mb-3">👥</div>
        <p class="text-gray-400 text-sm">No users found</p>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="mb-3 p-3 bg-gold-500/10 border border-gold-500/30 rounded-xl">
      <p class="text-gold-400 text-xs font-semibold">Total: <span class="text-lg font-bold">${filtered.length}</span> users</p>
    </div>
  ` + filtered.map(user => `
    <div class="black-card rounded-2xl p-4 mb-3">
      <div class="flex justify-between items-start mb-3">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="w-10 h-10 gold-gradient rounded-full flex items-center justify-center text-black font-bold text-base flex-shrink-0">
            ${(user.name || user.email || 'U').charAt(0).toUpperCase()}
          </div>
          <div class="min-w-0">
            <p class="font-bold text-white text-sm truncate">${user.name || 'Unknown'}</p>
            <p class="text-gray-500 text-xs truncate">${user.email || 'N/A'}</p>
          </div>
        </div>
        <button onclick="openUserModal('${user.uid}')" class="text-gold-400 text-xs bg-gold-500/10 px-3 py-1.5 rounded-lg border border-gold-500/30 flex-shrink-0">View</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div><span class="text-gray-500">📱 Phone:</span> <span class="text-white">${user.phone || 'N/A'}</span></div>
        <div><span class="text-gray-500">💰 Balance:</span> <span class="text-gold-400 font-bold">Rs. ${user.balance || 0}</span></div>
        <div class="col-span-2"><span class="text-gray-500">📅 Joined:</span> <span class="text-white">${user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-PK') : 'N/A'}</span></div>
      </div>
    </div>
  `).join('');
}

window.openUserModal = function(uid) {
  const user = allUsers.find(u => u.uid === uid);
  if (!user) return;

  const orders = allOrders.filter(o => o.userId === uid);
  const completedOrders = orders.filter(o => o.status === 'Completed').length;

  document.getElementById('userModalContent').innerHTML = `
    <div class="text-center mb-5">
      <div class="w-16 h-16 gold-gradient rounded-full flex items-center justify-center text-black font-bold text-2xl mx-auto mb-3">
        ${(user.name || user.email || 'U').charAt(0).toUpperCase()}
      </div>
      <p class="font-bold text-white text-base">${user.name || 'Unknown'}</p>
      <p class="text-gray-400 text-xs">${user.email || 'N/A'}</p>
    </div>

    <div class="bg-gold-500/10 border border-gold-500/30 rounded-xl p-4 mb-4 space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-gray-400">Balance:</span><span class="text-gold-400 font-bold">Rs. ${user.balance || 0}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Phone:</span><span class="text-white">${user.phone || 'N/A'}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Total Orders:</span><span class="text-white">${orders.length}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Completed:</span><span class="text-green-400">${completedOrders}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Provider:</span><span class="text-white">${user.authProvider || 'email'}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">UID:</span><span class="text-white text-xs break-all">${user.uid}</span></div>
    </div>

    <div class="space-y-2">
      <button onclick="resetUserPassword('${user.email}')" class="w-full bg-yellow-500/20 border border-yellow-500/40 text-yellow-400 py-3 rounded-xl text-sm font-semibold">
        🔑 Send Password Reset Email
      </button>
      <button onclick="updateUserBalance('${user.uid}', ${user.balance || 0})" class="w-full bg-blue-500/20 border border-blue-500/40 text-blue-400 py-3 rounded-xl text-sm font-semibold">
        💰 Update Balance
      </button>
      <button onclick="deleteUser('${user.uid}', '${user.email}')" class="w-full bg-red-500/20 border border-red-500/40 text-red-400 py-3 rounded-xl text-sm font-semibold">
        🗑️ Delete User
      </button>
    </div>
  `;

  document.getElementById('userModal').classList.remove('hidden');
  document.getElementById('userModal').classList.add('flex');
}

window.closeUserModal = function() {
  document.getElementById('userModal').classList.add('hidden');
  document.getElementById('userModal').classList.remove('flex');
}

window.resetUserPassword = async function(email) {
  try {
    await sendPasswordResetEmail(auth, email);
    alert('✅ Password reset email sent to: ' + email);
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

window.updateUserBalance = async function(uid, currentBalance) {
  const newBalance = prompt('Enter new balance (PKR):', currentBalance);
  if (newBalance === null) return;
  const parsed = parseFloat(newBalance);
  if (isNaN(parsed) || parsed < 0) {
    alert('❌ Invalid balance');
    return;
  }
  try {
    await updateDoc(doc(db, 'users', uid), { balance: parsed });
    alert('✅ Balance updated to Rs. ' + parsed);
    await loadUsers();
    closeUserModal();
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

window.deleteUser = async function(uid, email) {
  if (!confirm(`Delete user ${email}? This cannot be undone.`)) return;
  try {
    await deleteDoc(doc(db, 'users', uid));
    alert('✅ User deleted from Firestore.');
    await loadUsers();
    closeUserModal();
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

window.updateStatus = async function(orderId, newStatus) {
  if (!confirm(`Change status to "${newStatus}"?`)) return;
  try {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
    await loadOrders();
  } catch (err) {
    alert('❌ Error: ' + err.message);
  }
}

window.viewImage = function(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (order && order.screenshot) {
    document.getElementById('viewImage').src = order.screenshot;
    document.getElementById('imageModal').classList.remove('hidden');
    document.getElementById('imageModal').classList.add('flex');
    document.body.style.overflow = 'hidden';
  }
}

window.closeImage = function() {
  document.getElementById('imageModal').classList.add('hidden');
  document.getElementById('imageModal').classList.remove('flex');
  document.body.style.overflow = '';
}

function getStatusClass(status) {
  if (status === 'Completed') return 'status-completed';
  if (status === 'Rejected') return 'status-rejected';
  if (status === 'Processing') return 'status-processing';
  return 'status-pending';
}

function updateBadges() {
  document.getElementById('badgeOrders').textContent = allOrders.length;
  document.getElementById('badgeUsers').textContent = allUsers.length;
  document.getElementById('fAll').textContent = allOrders.length;
  document.getElementById('fPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('fProcessing').textContent = allOrders.filter(o => o.status === 'Processing').length;
  document.getElementById('fCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('fRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
}

function loadStats() {
  document.getElementById('statUsers').textContent = allUsers.length;
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statBuy').textContent = allOrders.filter(o => o.type === 'Buy').length;
  document.getElementById('statSell').textContent = allOrders.filter(o => o.type === 'Sell').length;
  document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('statCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('statRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
  const totalUsdt = allOrders.filter(o => o.status === 'Completed').reduce((s, o) => s + (parseFloat(o.usdtAmount) || 0), 0);
  document.getElementById('statUsdt').textContent = totalUsdt.toFixed(2);
}
</script>

</body>
</html>
