<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' }
        },
        fontFamily: { 'display': ['Poppins','sans-serif'], 'body': ['Inter','sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; }
  h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%); }
  .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .black-card { background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%); border: 1px solid #2a2a2a; }
  .gold-glow { box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
  .input-dark { background: #0a0a0a; border: 2px solid #2a2a2a; color: white; }
  .input-dark:focus { border-color: #f59e0b; outline: none; }
  .status-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
  .status-completed { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
  .status-rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
  .status-processing { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); }
  .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(245,158,11,0.3); border-radius: 50%; border-top-color: #f59e0b; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="text-white">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl shadow-lg gold-glow mx-auto">👑</div>
      <h1 class="text-2xl font-black text-white mt-4">Admin Login</h1>
      <p class="text-gray-400 text-sm mt-1">USDT Exchange PK</p>
    </div>

    <div class="black-card rounded-3xl p-8">
      <form onsubmit="adminLogin(event)" class="space-y-5">
        <div>
          <label class="block text-gray-400 text-sm mb-2 font-medium">📧 Email</label>
          <input type="email" id="adminEmail" required placeholder="admin@usdtexchange.pk" 
                 class="input-dark w-full px-5 py-4 rounded-xl text-base">
        </div>
        <div>
          <label class="block text-gray-400 text-sm mb-2 font-medium">🔒 Password</label>
          <input type="password" id="adminPass" required placeholder="Admin password" 
                 class="input-dark w-full px-5 py-4 rounded-xl text-base">
        </div>
        <button type="submit" id="loginBtn" class="w-full gold-gradient text-black font-bold py-4 rounded-xl text-lg shadow-lg gold-glow">
          🚀 Login
        </button>
        <p id="adminError" class="text-red-400 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
  <header class="backdrop-blur-xl bg-black/80 shadow-lg sticky top-0 z-50 border-b border-gold-500/20">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center text-black font-bold text-lg">👑</div>
        <div>
          <h1 class="font-bold text-sm text-white leading-tight">Admin Panel</h1>
          <p class="text-xs text-gold-400" id="adminEmailDisplay">Loading...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadOrders()" class="text-gold-400 hover:text-gold-300 text-sm font-medium bg-gold-500/10 px-4 py-2 rounded-lg border border-gold-500/30">🔄</button>
        <button onclick="adminLogout()" class="text-gray-300 hover:text-red-400 text-sm font-medium bg-red-500/10 px-4 py-2 rounded-lg border border-red-500/30">Logout</button>
      </div>
    </div>
  </header>

  <main class="py-6 px-4 pb-24">
    <div class="container mx-auto max-w-4xl">

      <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
        <button onclick="showTab('all')" id="tabAll" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black">📋 All</button>
        <button onclick="showTab('buy')" id="tabBuy" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">💰 Buy</button>
        <button onclick="showTab('sell')" id="tabSell" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">💵 Sell</button>
        <button onclick="showTab('pending')" id="tabPending" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">⏳ Pending</button>
        <button onclick="showTab('stats')" id="tabStats" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">📊 Stats</button>
      </div>

      <div id="ordersContainer">
        <div class="text-center py-8"><span class="loading"></span></div>
      </div>

      <div id="statsContainer" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">📦</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Total</p>
            <p class="text-2xl font-black gold-text" id="statTotal">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">💰</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Buy Orders</p>
            <p class="text-2xl font-black text-green-400" id="statBuy">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">💵</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Sell Orders</p>
            <p class="text-2xl font-black text-orange-400" id="statSell">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">⏳</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Pending</p>
            <p class="text-2xl font-black text-gold-400" id="statPending">0</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- IMAGE VIEWER MODAL -->
<div id="imageModal" class="hidden fixed inset-0 z-[9999] bg-black/95 items-center justify-center p-4" onclick="closeImage()">
  <div class="max-w-4xl max-h-screen w-full relative">
    <button onclick="closeImage()" class="absolute top-4 right-4 w-10 h-10 bg-white/10 rounded-full text-white text-xl z-10">✕</button>
    <img id="viewImage" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl mx-auto">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allOrders = [];
let currentFilter = 'all';

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
    if (adminDoc.exists()) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('adminEmailDisplay').textContent = user.email;
      loadOrders();
    } else {
      await signOut(auth);
      const errEl = document.getElementById('adminError');
      errEl.textContent = '❌ You are not an admin';
      errEl.classList.remove('hidden');
    }
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
  }
});

window.adminLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const errEl = document.getElementById('adminError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  btn.textContent = '⏳ Logging in...';
  btn.disabled = true;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/user-not-found') msg += 'Email not registered';
    else if (err.code === 'auth/wrong-password') msg += 'Wrong password';
    else if (err.code === 'auth/invalid-credential') msg += 'Invalid email or password';
    else msg += err.message;
    
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = '🚀 Login';
    btn.disabled = false;
  }
}

window.adminLogout = async function() {
  await signOut(auth);
  window.location.reload();
}

window.showTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20';
  });
  event.target.className = 'tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black';

  if (tab === 'stats') {
    document.getElementById('ordersContainer').classList.add('hidden');
    document.getElementById('statsContainer').classList.remove('hidden');
    loadStats();
  } else {
    document.getElementById('ordersContainer').classList.remove('hidden');
    document.getElementById('statsContainer').classList.add('hidden');
    currentFilter = tab;
    renderOrders();
  }
}

window.loadOrders = async function() {
  const container = document.getElementById('ordersContainer');
  container.innerHTML = '<div class="text-center py-8"><span class="loading"></span></div>';

  try {
    const snap = await getDocs(collection(db, 'orders'));
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderOrders();
  } catch (err) {
    console.error(err);
    container.innerHTML = '<p class="text-center text-red-400 py-8">Failed to load orders: ' + err.message + '</p>';
  }
}

function renderOrders() {
  const container = document.getElementById('ordersContainer');
  let filtered = allOrders;
  
  if (currentFilter === 'pending') filtered = allOrders.filter(o => o.status === 'Pending');
  else if (currentFilter === 'buy') filtered = allOrders.filter(o => o.type === 'Buy');
  else if (currentFilter === 'sell') filtered = allOrders.filter(o => o.type === 'Sell');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="black-card rounded-2xl p-8 text-center">
        <div class="text-5xl mb-3">📭</div>
        <p class="text-gray-400 text-sm">No orders found</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(order => {
    const isSell = order.type === 'Sell';
    const typeColor = isSell ? 'text-orange-400' : 'text-green-400';
    const typeEmoji = isSell ? '💵' : '💰';
    const borderColor = isSell ? 'border-orange-500' : 'border-green-500';

    const screenshotHtml = order.screenshot 
      ? `<div class="mb-3">
           <p class="text-gray-500 text-xs mb-2">📸 Payment Screenshot:</p>
           <img src="${order.screenshot}" 
                onclick="viewImage('${order.id}')" 
                class="w-full max-h-48 object-contain rounded-xl border-2 border-gold-500/30 cursor-pointer hover:border-gold-500 transition">
           <p class="text-xs text-gold-400 mt-1 text-center">👆 Tap to view full size</p>
         </div>`
      : `<div class="mb-3 p-3 bg-yellow-900/20 border border-yellow-500/30 rounded-xl">
           <p class="text-xs text-yellow-400">⚠️ No screenshot uploaded</p>
         </div>`;

    let detailFields = '';

    if (!isSell) {
      // BUY ORDER FIELDS
      detailFields = `
        <div>
          <p class="text-gray-500">Sender Name</p>
          <p class="text-white font-semibold">${order.senderName || 'N/A'}</p>
        </div>
        <div>
          <p class="text-gray-500">Amount Sent (PKR)</p>
          <p class="text-white font-semibold">Rs. ${order.amountSent || 'N/A'}</p>
        </div>
        <div class="col-span-2">
          <p class="text-gray-500">Receive Method</p>
          <p class="text-white font-semibold">${order.receiveMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</p>
        </div>
        ${order.binanceUid ? `<div><p class="text-gray-500">Binance UID</p><p class="text-white font-semibold break-all text-xs">${order.binanceUid}</p></div>` : ''}
        ${order.binanceName ? `<div><p class="text-gray-500">Binance Name</p><p class="text-white font-semibold">${order.binanceName}</p></div>` : ''}
        ${order.walletAddress ? `<div class="col-span-2"><p class="text-gray-500">Wallet Address</p><p class="text-white font-semibold break-all text-xs">${order.walletAddress}</p></div>` : ''}
      `;
    } else {
      // SELL ORDER FIELDS
      detailFields = `
        <div>
          <p class="text-gray-500">Amount Sent (USDT)</p>
          <p class="text-white font-semibold">${order.amountSentUsdt || 'N/A'} USDT</p>
        </div>
        <div>
          <p class="text-gray-500">Payment Method</p>
          <p class="text-white font-semibold">💳 ${order.paymentMethod || 'N/A'}</p>
        </div>
        <div class="col-span-2">
          <p class="text-gray-500">Sender Method</p>
          <p class="text-white font-semibold">${order.senderMethod === 'binance' ? '🟡 From Binance' : '💼 From Wallet'}</p>
        </div>
        ${order.senderBinanceUid ? `<div><p class="text-gray-500">Sender Binance UID</p><p class="text-white font-semibold break-all text-xs">${order.senderBinanceUid}</p></div>` : ''}
        ${order.senderBinanceName ? `<div><p class="text-gray-500">Sender Binance Name</p><p class="text-white font-semibold">${order.senderBinanceName}</p></div>` : ''}
        ${order.senderWalletAddress ? `<div class="col-span-2"><p class="text-gray-500">Sender Wallet Address</p><p class="text-white font-semibold break-all text-xs">${order.senderWalletAddress}</p></div>` : ''}
        ${order.senderWalletName ? `<div class="col-span-2"><p class="text-gray-500">Sender Wallet Name</p><p class="text-white font-semibold">${order.senderWalletName}</p></div>` : ''}
        <div>
          <p class="text-gray-500">Receiver Name</p>
          <p class="text-white font-semibold">${order.receiverName || 'N/A'}</p>
        </div>
        <div>
          <p class="text-gray-500">Receiver Number</p>
          <p class="text-white font-semibold">${order.receiverPhone || 'N/A'}</p>
        </div>
      `;
    }

    const primaryAmount = isSell 
      ? `${order.usdtAmount || 0} USDT` 
      : `Rs. ${order.pkrAmount || 0}`;
    
    const secondaryAmount = isSell 
      ? `Rs. ${order.pkrAmount || 0}` 
      : `${order.usdtAmount || 0} USDT`;

    return `
    <div class="black-card rounded-2xl p-4 mb-3 border-l-4 ${borderColor}">
      <div class="flex justify-between items-start mb-3">
        <div>
          <p class="font-bold text-white text-sm">${typeEmoji} ${order.type || 'Buy'} USDT</p>
          <p class="text-gray-500 text-xs mt-1">#${order.id.substring(0,8).toUpperCase()}</p>
        </div>
        <span class="text-xs px-3 py-1 rounded-full font-semibold ${getStatusClass(order.status)}">${order.status || 'Pending'}</span>
      </div>
      
      <div class="grid grid-cols-2 gap-3 text-xs mb-3">
        <div>
          <p class="text-gray-500">${isSell ? 'USDT Amount' : 'PKR Amount'}</p>
          <p class="text-white font-semibold ${typeColor}">${primaryAmount}</p>
        </div>
        <div>
          <p class="text-gray-500">${isSell ? 'PKR to Send' : 'USDT to Send'}</p>
          <p class="text-white font-semibold">${secondaryAmount}</p>
        </div>
        <div>
          <p class="text-gray-500">Rate</p>
          <p class="text-white font-semibold">Rs. ${order.rate || 0}</p>
        </div>
        <div>
          <p class="text-gray-500">Date</p>
          <p class="text-white font-semibold">${order.date || 'N/A'}</p>
        </div>
        ${detailFields}
        <div class="col-span-2">
          <p class="text-gray-500">Customer Email</p>
          <p class="text-white font-semibold break-all text-xs">${order.userEmail || 'N/A'}</p>
        </div>
        <div class="col-span-2">
          <p class="text-gray-500">TRX ID</p>
          <p class="text-white font-semibold break-all text-xs">${order.trxId || 'N/A'}</p>
        </div>
      </div>

      ${screenshotHtml}

      <div class="flex gap-2">
        <button onclick="updateStatus('${order.id}', 'Processing')" class="flex-1 bg-blue-500/20 border border-blue-500/40 text-blue-400 py-2 rounded-lg text-xs font-semibold">Processing</button>
        <button onclick="updateStatus('${order.id}', 'Completed')" class="flex-1 bg-green-500/20 border border-green-500/40 text-green-400 py-2 rounded-lg text-xs font-semibold">✓ Complete</button>
        <button onclick="updateStatus('${order.id}', 'Rejected')" class="flex-1 bg-red-500/20 border border-red-500/40 text-red-400 py-2 rounded-lg text-xs font-semibold">✕ Reject</button>
      </div>
    </div>
    `;
  }).join('');
}

window.viewImage = function(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (order && order.screenshot) {
    document.getElementById('viewImage').src = order.screenshot;
    document.getElementById('imageModal').classList.remove('hidden');
    document.getElementById('imageModal').classList.add('flex');
    document.body.style.overflow = 'hidden';
  }
}

window.closeImage = function() {
  document.getElementById('imageModal').classList.add('hidden');
  document.getElementById('imageModal').classList.remove('flex');
  document.body.style.overflow = '';
}

function getStatusClass(status) {
  if (status === 'Completed') return 'status-completed';
  if (status === 'Rejected') return 'status-rejected';
  if (status === 'Processing') return 'status-processing';
  return 'status-pending';
}

window.updateStatus = async function(orderId, newStatus) {
  try {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
    alert('✅ Status updated: ' + newStatus);
    loadOrders();
  } catch (err) {
    console.error(err);
    alert('❌ Error: ' + err.message);
  }
}

function loadStats() {
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statBuy').textContent = allOrders.filter(o => o.type === 'Buy').length;
  document.getElementById('statSell').textContent = allOrders.filter(o => o.type === 'Sell').length;
  document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
}
</script>

</body>
</html>
