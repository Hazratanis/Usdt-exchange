<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Admin — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  h1,h2,h3 { font-family: 'Poppins', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  .gold-text { background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card { background: #141414; border: 1px solid #262626; }
  .input-dark { background: #0a0a0a; border: 2px solid #262626; color: white; outline: none; transition: border-color 0.2s; }
  .input-dark:focus { border-color: #f59e0b; }
  .btn-gold { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: black; font-weight: 700; }
  .btn-gold:active { opacity: 0.85; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(245,158,11,0.3); border-radius: 50%; border-top-color: #f59e0b; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-bg { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .no-sb::-webkit-scrollbar { display: none; }
  .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 99999; transition: transform 0.3s; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast-ok { background: #16a34a; color: white; }
  .toast-err { background: #dc2626; color: white; }
  .s-pending { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
  .s-completed { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
  .s-rejected { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
  .s-processing { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.4); }
</style>
</head>
<body class="text-white">

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl mx-auto mb-3">👑</div>
      <h1 class="text-2xl font-bold">Admin Login</h1>
      <p class="text-gray-500 text-xs mt-1">USDT Exchange PK</p>
    </div>
    <div class="card rounded-2xl p-6">
      <form onsubmit="adminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-gray-400 text-xs mb-1.5 font-semibold">Email</label>
          <input type="email" id="adminEmail" required placeholder="admin@example.com" autocomplete="email"
                 class="input-dark w-full px-4 py-3 rounded-xl">
        </div>
        <div>
          <label class="block text-gray-400 text-xs mb-1.5 font-semibold">Password</label>
          <input type="password" id="adminPass" required placeholder="••••••••" autocomplete="current-password"
                 class="input-dark w-full px-4 py-3 rounded-xl">
        </div>
        <button type="submit" id="loginBtn" class="btn-gold w-full py-3.5 rounded-xl text-base">
          Login
        </button>
        <p id="adminError" class="text-red-400 text-xs text-center hidden bg-red-500/10 border border-red-500/30 rounded-lg py-2 px-3"></p>
      </form>
      <p class="text-center text-gray-600 text-[11px] mt-4">🔒 Login saved — logout tak dobara nahi poochega</p>
    </div>
  </div>
</div>

<!-- PANEL -->
<div id="adminPanel" class="hidden">
  <header class="bg-black/95 backdrop-blur-xl border-b border-gold-500/20 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center text-black text-lg font-bold flex-shrink-0">👑</div>
        <div class="min-w-0">
          <h1 class="font-bold text-sm leading-tight">Admin Panel</h1>
          <p class="text-[11px] text-gold-400 truncate" id="adminEmailDisplay">...</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button onclick="loadAllData()" id="refreshBtn" class="text-gold-400 bg-gold-500/10 w-9 h-9 rounded-lg border border-gold-500/30 text-sm">🔄</button>
        <button onclick="adminLogout()" class="text-red-400 bg-red-500/10 px-3 h-9 rounded-lg border border-red-500/30 text-xs font-semibold">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 pb-24">
    <!-- TABS -->
    <div class="flex gap-2 mb-4 overflow-x-auto no-sb pb-1">
      <button onclick="showTab('orders', this)" id="tabOrders" class="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold bg-gold-500 text-black">
        📋 Orders <span id="badgeOrders" class="text-xs opacity-80">(0)</span>
      </button>
      <button onclick="showTab('users', this)" id="tabUsers" class="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">
        👥 Users <span id="badgeUsers" class="text-xs opacity-80">(0)</span>
      </button>
      <button onclick="showTab('stats', this)" id="tabStats" class="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">
        📊 Stats
      </button>
    </div>

    <!-- ORDERS TAB -->
    <div id="ordersTab">
      <div class="flex gap-2 mb-3 overflow-x-auto no-sb pb-1">
        <button onclick="filterOrders('all', this)" class="f-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold bg-gold-500 text-black">
          All <span id="fAll">0</span>
        </button>
        <button onclick="filterOrders('Pending', this)" class="f-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-700">
          ⏳ <span id="fPending">0</span>
        </button>
        <button onclick="filterOrders('Processing', this)" class="f-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-700">
          🔄 <span id="fProcessing">0</span>
        </button>
        <button onclick="filterOrders('Completed', this)" class="f-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-700">
          ✅ <span id="fCompleted">0</span>
        </button>
        <button onclick="filterOrders('Rejected', this)" class="f-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-700">
          ❌ <span id="fRejected">0</span>
        </button>
      </div>

      <input type="text" id="orderSearch" oninput="renderOrders()" placeholder="🔍 Name, phone, TRX, order ID..."
             class="input-dark w-full px-4 py-3 rounded-xl text-sm mb-4">

      <div id="ordersContainer">
        <div class="text-center py-12"><span class="spinner"></span></div>
      </div>
    </div>

    <!-- USERS TAB -->
    <div id="usersTab" class="hidden">
      <input type="text" id="userSearch" oninput="renderUsers()" placeholder="🔍 Name, email, phone..."
             class="input-dark w-full px-4 py-3 rounded-xl text-sm mb-4">
      <div id="usersContainer"></div>
    </div>

    <!-- STATS TAB -->
    <div id="statsTab" class="hidden">
      <div class="grid grid-cols-2 gap-3">
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">👥 Users</p>
          <p class="text-2xl font-bold gold-text mt-1" id="statUsers">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">📦 Orders</p>
          <p class="text-2xl font-bold gold-text mt-1" id="statTotal">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">💰 Buy</p>
          <p class="text-2xl font-bold text-green-400 mt-1" id="statBuy">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">💵 Sell</p>
          <p class="text-2xl font-bold text-orange-400 mt-1" id="statSell">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">⏳ Pending</p>
          <p class="text-2xl font-bold text-gold-400 mt-1" id="statPending">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">✅ Done</p>
          <p class="text-2xl font-bold text-green-400 mt-1" id="statCompleted">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">❌ Rejected</p>
          <p class="text-2xl font-bold text-red-400 mt-1" id="statRejected">0</p>
        </div>
        <div class="card rounded-2xl p-4">
          <p class="text-gray-500 text-xs">💎 USDT</p>
          <p class="text-xl font-bold gold-text mt-1" id="statUsdt">0</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- IMAGE -->
<div id="imageModal" class="hidden fixed inset-0 z-[9999] modal-bg items-center justify-center p-4" onclick="closeImage()">
  <img id="viewImage" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl">
</div>

<!-- USER MODAL -->
<div id="userModal" class="hidden fixed inset-0 z-[9999] modal-bg items-center justify-center p-4">
  <div class="card rounded-2xl p-6 max-w-sm w-full border-2 border-gold-500/40 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold">User Details</h3>
      <button onclick="closeUserModal()" class="text-gray-400 text-2xl w-8 h-8 flex items-center justify-center">✕</button>
    </div>
    <div id="userModalContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqnJ03WOnX4_hlo4MK2Wc4ZJv8dCgDFgE",
  authDomain: "usdt-exchange-24226.firebaseapp.com",
  projectId: "usdt-exchange-24226",
  storageBucket: "usdt-exchange-24226.firebasestorage.app",
  messagingSenderId: "1024697758253",
  appId: "1:1024697758253:web:8894b945db08d6536e3ea4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔑 SESSION PERSIST — Browser band karke dobara kholne pe bhi logged in rahega
setPersistence(auth, browserLocalPersistence).catch(err => console.error('Persistence:', err));

let allOrders = [];
let allUsers = [];
let currentFilter = 'all';

// TOAST
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// AUTH STATE — session check karta hai
onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      const adminDoc = await getDoc(doc(db, 'admins', user.uid));
      if (adminDoc.exists()) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('adminEmailDisplay').textContent = user.email;
        loadAllData();
      } else {
        await signOut(auth);
        const e = document.getElementById('adminError');
        e.textContent = '❌ Not authorized as admin';
        e.classList.remove('hidden');
      }
    } catch (err) { console.error(err); }
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
  }
});

window.adminLogin = async (e) => {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  const errEl = document.getElementById('adminError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  btn.textContent = 'Logging in...';
  btn.disabled = true;

  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, pass);
    toast('✅ Login successful!');
  } catch (err) {
    let msg = '❌ ';
    if (err.code === 'auth/user-not-found') msg += 'Email not registered';
    else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg += 'Invalid email or password';
    else if (err.code === 'auth/too-many-requests') msg += 'Too many attempts, try later';
    else msg += err.message;
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    btn.textContent = 'Login';
    btn.disabled = false;
  }
}

window.adminLogout = async () => {
  if (!confirm('Logout? Aapko dobara login karna hoga.')) return;
  await signOut(auth);
  toast('👋 Logged out');
  setTimeout(() => location.reload(), 400);
}

window.loadAllData = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('animate-spin');
  await Promise.all([loadOrders(), loadUsers()]);
  updateBadges();
  btn.classList.remove('animate-spin');
}

// ===== TABS =====
window.showTab = (tab, el) => {
  document.querySelectorAll('#tabOrders, #tabUsers, #tabStats').forEach(b => {
    b.classList.remove('bg-gold-500', 'text-black');
    b.classList.add('bg-gray-900', 'text-gray-300', 'border', 'border-gold-500/20');
  });
  el.classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gold-500/20');
  el.classList.add('bg-gold-500', 'text-black');

  document.getElementById('ordersTab').classList.add('hidden');
  document.getElementById('usersTab').classList.add('hidden');
  document.getElementById('statsTab').classList.add('hidden');

  if (tab === 'orders') document.getElementById('ordersTab').classList.remove('hidden');
  else if (tab === 'users') document.getElementById('usersTab').classList.remove('hidden');
  else if (tab === 'stats') { document.getElementById('statsTab').classList.remove('hidden'); loadStats(); }
}

// ===== ORDERS =====
window.loadOrders = async () => {
  try {
    const snap = await getDocs(collection(db, 'orders'));
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    renderOrders();
  } catch (err) {
    document.getElementById('ordersContainer').innerHTML = '<p class="text-center text-red-400 py-8 text-sm">Failed to load</p>';
  }
}

window.filterOrders = (status, el) => {
  currentFilter = status;
  document.querySelectorAll('.f-btn').forEach(b => {
    b.classList.remove('bg-gold-500', 'text-black');
    b.classList.add('bg-gray-900', 'text-gray-300', 'border', 'border-gray-700');
  });
  el.classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gray-700');
  el.classList.add('bg-gold-500', 'text-black');
  renderOrders();
}

function renderOrders() {
  const c = document.getElementById('ordersContainer');
  const s = (document.getElementById('orderSearch')?.value || '').toLowerCase().trim();

  let list = allOrders;
  if (currentFilter !== 'all') list = list.filter(o => o.status === currentFilter);
  if (s) {
    list = list.filter(o =>
      (o.customerName || o.senderName || o.receiverName || '').toLowerCase().includes(s) ||
      (o.customerPhone || o.receiverPhone || '').includes(s) ||
      (o.id || '').toLowerCase().includes(s) ||
      (o.trxId || '').toLowerCase().includes(s) ||
      (o.userEmail || '').toLowerCase().includes(s)
    );
  }

  if (!list.length) {
    c.innerHTML = '<div class="card rounded-2xl p-10 text-center"><div class="text-4xl mb-2 opacity-50">📭</div><p class="text-gray-400 text-sm">No orders</p></div>';
    return;
  }

  c.innerHTML = list.map(o => {
    const isSell = o.type === 'Sell';
    const bColor = isSell ? 'border-l-orange-500' : 'border-l-green-500';
    const emoji = isSell ? '💵' : '💰';
    const col = isSell ? 'text-orange-400' : 'text-green-400';

    const shot = o.screenshot
      ? `<img src="${o.screenshot}" onclick="viewImage('${o.id}')" class="w-full max-h-40 object-contain rounded-lg border border-gold-500/30 cursor-pointer mb-2">`
      : `<div class="mb-2 p-2 bg-yellow-900/20 border border-yellow-500/30 rounded-lg text-[11px] text-yellow-400">⚠️ No screenshot</div>`;

    let det = '';
    if (!isSell) {
      det = `
        <div><span class="text-gray-500">Sender:</span> <span class="text-white">${o.senderName || '-'}</span></div>
        <div><span class="text-gray-500">Sent:</span> <span class="text-white">Rs. ${o.amountSent || 0}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Receive:</span> <span class="text-white">${o.receiveMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${o.binanceUid ? `<div class="col-span-2"><span class="text-gray-500">Binance UID:</span> <span class="text-white break-all">${o.binanceUid}</span></div>` : ''}
        ${o.walletAddress ? `<div class="col-span-2"><span class="text-gray-500">Wallet:</span> <span class="text-white break-all">${o.walletAddress}</span></div>` : ''}
      `;
    } else {
      det = `
        <div><span class="text-gray-500">Sent:</span> <span class="text-white">${o.amountSentUsdt || 0} USDT</span></div>
        <div><span class="text-gray-500">Pay:</span> <span class="text-white">${o.paymentMethod || '-'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Sender:</span> <span class="text-white">${o.senderMethod === 'binance' ? '🟡 Binance' : '💼 Wallet'}</span></div>
        ${o.senderBinanceUid ? `<div class="col-span-2"><span class="text-gray-500">Binance UID:</span> <span class="text-white break-all">${o.senderBinanceUid}</span></div>` : ''}
        ${o.senderWalletAddress ? `<div class="col-span-2"><span class="text-gray-500">Wallet:</span> <span class="text-white break-all">${o.senderWalletAddress}</span></div>` : ''}
        <div><span class="text-gray-500">Recv:</span> <span class="text-white">${o.receiverName || '-'}</span></div>
        <div><span class="text-gray-500">No:</span> <span class="text-white">${o.receiverPhone || '-'}</span></div>
      `;
    }

    const p = isSell ? `${o.usdtAmount || 0} USDT` : `Rs. ${o.pkrAmount || 0}`;
    const sec = isSell ? `Rs. ${o.pkrAmount || 0}` : `${o.usdtAmount || 0} USDT`;

    return `
    <div class="card rounded-2xl p-4 mb-3 border-l-4 ${bColor}">
      <div class="flex justify-between items-start mb-3">
        <div>
          <p class="font-bold text-sm">${emoji} ${o.type || 'Buy'} USDT</p>
          <p class="text-gray-500 text-[11px] font-mono mt-0.5">#${o.id.substring(0,10).toUpperCase()}</p>
        </div>
        <span class="text-[11px] px-2.5 py-1 rounded-full font-semibold ${stCls(o.status)}">${o.status || 'Pending'}</span>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs mb-3">
        <div><span class="text-gray-500">${isSell ? 'USDT' : 'PKR'}:</span> <span class="${col} font-bold">${p}</span></div>
        <div><span class="text-gray-500">${isSell ? 'PKR' : 'USDT'}:</span> <span class="text-white font-bold">${sec}</span></div>
        ${det}
        <div class="col-span-2"><span class="text-gray-500">Email:</span> <span class="text-white break-all">${o.userEmail || '-'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">TRX:</span> <span class="text-white break-all font-mono">${o.trxId || '-'}</span></div>
        <div class="col-span-2"><span class="text-gray-500">Date:</span> <span class="text-white">${o.date || '-'}</span></div>
      </div>

      ${shot}

      <div class="flex gap-2 mt-2">
        <button onclick="updateStatus('${o.id}', 'Processing')" class="flex-1 bg-blue-500/20 border border-blue-500/40 text-blue-400 py-2 rounded-lg text-xs font-semibold">🔄</button>
        <button onclick="updateStatus('${o.id}', 'Completed')" class="flex-1 bg-green-500/20 border border-green-500/40 text-green-400 py-2 rounded-lg text-xs font-semibold">✓ Done</button>
        <button onclick="updateStatus('${o.id}', 'Rejected')" class="flex-1 bg-red-500/20 border border-red-500/40 text-red-400 py-2 rounded-lg text-xs font-semibold">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ===== USERS =====
window.loadUsers = async () => {
  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    allUsers.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    renderUsers();
  } catch (err) { console.error(err); }
}

function renderUsers() {
  const c = document.getElementById('usersContainer');
  const s = (document.getElementById('userSearch')?.value || '').toLowerCase().trim();

  let list = allUsers;
  if (s) {
    list = list.filter(u =>
      (u.name || '').toLowerCase().includes(s) ||
      (u.email || '').toLowerCase().includes(s) ||
      (u.phone || '').includes(s)
    );
  }

  if (!list.length) {
    c.innerHTML = '<div class="card rounded-2xl p-10 text-center"><div class="text-4xl mb-2 opacity-50">👥</div><p class="text-gray-400 text-sm">No users</p></div>';
    return;
  }

  c.innerHTML = `
    <div class="mb-3 p-3 bg-gold-500/10 border border-gold-500/30 rounded-xl text-xs text-gold-400 font-semibold">
      Showing ${list.length} of ${allUsers.length} users
    </div>
  ` + list.map(u => `
    <div class="card rounded-2xl p-4 mb-3">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div class="w-10 h-10 gold-gradient rounded-full flex items-center justify-center text-black font-bold flex-shrink-0">
            ${(u.name || u.email || 'U').charAt(0).toUpperCase()}
          </div>
          <div class="min-w-0">
            <p class="font-bold text-sm truncate">${u.name || 'Unknown'}</p>
            <p class="text-gray-500 text-[11px] truncate">${u.email || '-'}</p>
          </div>
        </div>
        <button onclick="openUserModal('${u.uid}')" class="text-gold-400 text-xs bg-gold-500/10 px-3 py-1.5 rounded-lg border border-gold-500/30 flex-shrink-0">View</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div><span class="text-gray-500">📱</span> <span class="text-white">${u.phone || '-'}</span></div>
        <div><span class="text-gray-500">💰</span> <span class="text-gold-400 font-bold">Rs. ${u.balance || 0}</span></div>
        <div class="col-span-2"><span class="text-gray-500">📅</span> <span class="text-white">${u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-PK') : '-'}</span></div>
      </div>
    </div>
  `).join('');
}

// ===== USER MODAL =====
window.openUserModal = (uid) => {
  const u = allUsers.find(x => x.uid === uid);
  if (!u) return;
  const orders = allOrders.filter(o => o.userId === uid);
  const done = orders.filter(o => o.status === 'Completed').length;

  document.getElementById('userModalContent').innerHTML = `
    <div class="text-center mb-4">
      <div class="w-16 h-16 gold-gradient rounded-full flex items-center justify-center text-black font-bold text-2xl mx-auto mb-2">
        ${(u.name || u.email || 'U').charAt(0).toUpperCase()}
      </div>
      <p class="font-bold">${u.name || 'Unknown'}</p>
      <p class="text-gray-400 text-xs">${u.email || '-'}</p>
    </div>

    <div class="bg-gold-500/10 border border-gold-500/30 rounded-xl p-4 mb-4 space-y-2 text-xs">
      <div class="flex justify-between"><span class="text-gray-400">Balance:</span><span class="text-gold-400 font-bold">Rs. ${u.balance || 0}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Phone:</span><span class="text-white">${u.phone || '-'}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Orders:</span><span class="text-white">${orders.length}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Completed:</span><span class="text-green-400">${done}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">UID:</span><span class="text-white text-[10px] break-all font-mono">${u.uid}</span></div>
    </div>

    <div class="space-y-2">
      <button onclick="resetPass('${u.email}')" class="w-full bg-yellow-500/20 border border-yellow-500/40 text-yellow-400 py-2.5 rounded-xl text-xs font-semibold">🔑 Reset Password Email</button>
      <button onclick="updateBal('${u.uid}', ${u.balance || 0})" class="w-full bg-blue-500/20 border border-blue-500/40 text-blue-400 py-2.5 rounded-xl text-xs font-semibold">💰 Update Balance</button>
      <button onclick="delUser('${u.uid}', '${u.email}')" class="w-full bg-red-500/20 border border-red-500/40 text-red-400 py-2.5 rounded-xl text-xs font-semibold">🗑️ Delete User</button>
    </div>
  `;
  const m = document.getElementById('userModal');
  m.classList.remove('hidden');
  m.classList.add('flex');
}

window.closeUserModal = () => {
  const m = document.getElementById('userModal');
  m.classList.add('hidden');
  m.classList.remove('flex');
}

window.resetPass = async (email) => {
  if (!confirm('Send reset email to ' + email + '?')) return;
  try {
    await sendPasswordResetEmail(auth, email);
    toast('✅ Reset email sent');
  } catch (err) { toast('❌ ' + err.message, 'err'); }
}

window.updateBal = async (uid, curr) => {
  const nb = prompt('New balance (PKR):', curr);
  if (nb === null) return;
  const p = parseFloat(nb);
  if (isNaN(p) || p < 0) return toast('❌ Invalid balance', 'err');
  try {
    await updateDoc(doc(db, 'users', uid), { balance: p });
    toast('✅ Balance updated');
    await loadUsers();
    closeUserModal();
  } catch (err) { toast('❌ ' + err.message, 'err'); }
}

window.delUser = async (uid, email) => {
  if (!confirm('Delete user ' + email + '? Cannot be undone.')) return;
  try {
    await deleteDoc(doc(db, 'users', uid));
    toast('✅ User deleted');
    await loadUsers();
    closeUserModal();
  } catch (err) { toast('❌ ' + err.message, 'err'); }
}

// ===== STATUS =====
window.updateStatus = async (id, status) => {
  if (!confirm(`Change to ${status}?`)) return;
  try {
    await updateDoc(doc(db, 'orders', id), { status, updatedAt: new Date().toISOString() });
    toast(`✅ ${status}`);
    await loadOrders();
    updateBadges();
  } catch (err) { toast('❌ ' + err.message, 'err'); }
}

// ===== IMAGE =====
window.viewImage = (id) => {
  const o = allOrders.find(x => x.id === id);
  if (o?.screenshot) {
    document.getElementById('viewImage').src = o.screenshot;
    const m = document.getElementById('imageModal');
    m.classList.remove('hidden');
    m.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }
}

window.closeImage = () => {
  const m = document.getElementById('imageModal');
  m.classList.add('hidden');
  m.classList.remove('flex');
  document.body.style.overflow = '';
}

// ===== HELPERS =====
function stCls(s) {
  if (s === 'Completed') return 's-completed';
  if (s === 'Rejected') return 's-rejected';
  if (s === 'Processing') return 's-processing';
  return 's-pending';
}

function updateBadges() {
  document.getElementById('badgeOrders').textContent = `(${allOrders.length})`;
  document.getElementById('badgeUsers').textContent = `(${allUsers.length})`;
  document.getElementById('fAll').textContent = allOrders.length;
  document.getElementById('fPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('fProcessing').textContent = allOrders.filter(o => o.status === 'Processing').length;
  document.getElementById('fCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('fRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
}

function loadStats() {
  document.getElementById('statUsers').textContent = allUsers.length;
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statBuy').textContent = allOrders.filter(o => o.type === 'Buy').length;
  document.getElementById('statSell').textContent = allOrders.filter(o => o.type === 'Sell').length;
  document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('statCompleted').textContent = allOrders.filter(o => o.status === 'Completed').length;
  document.getElementById('statRejected').textContent = allOrders.filter(o => o.status === 'Rejected').length;
  const total = allOrders.filter(o => o.status === 'Completed').reduce((s, o) => s + (parseFloat(o.usdtAmount) || 0), 0);
  document.getElementById('statUsdt').textContent = total.toFixed(2);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeImage(); closeUserModal(); } });
</script>

</body>
</html>
