<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — USDT Exchange PK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { 
    theme: {
      extend: {
        colors: {
          'gold': { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' }
        },
        fontFamily: { 'display': ['Poppins','sans-serif'], 'body': ['Inter','sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; }
  h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%); }
  .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .black-card { background: linear-gradient(135deg, #141414 0%, #1a1a1a 100%); border: 1px solid #2a2a2a; }
  .gold-glow { box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
  .input-dark { background: #0a0a0a; border: 2px solid #2a2a2a; color: white; }
  .input-dark:focus { border-color: #f59e0b; outline: none; }
  .status-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
  .status-completed { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
  .status-rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
  .status-processing { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); }
</style>
</head>
<body class="text-white">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center text-black font-bold text-3xl shadow-lg gold-glow mx-auto">🔐</div>
      <h1 class="text-2xl font-black text-white mt-4">Admin Login</h1>
      <p class="text-gray-400 text-sm mt-1">USDT Exchange PK</p>
    </div>

    <div class="black-card rounded-3xl p-8">
      <form onsubmit="adminLogin(event)" class="space-y-5">
        <div>
          <label class="block text-gray-400 text-sm mb-2 font-medium">🔒 Password</label>
          <input type="password" id="adminPass" required placeholder="Enter admin password" 
                 class="input-dark w-full px-5 py-4 rounded-xl text-base">
        </div>
        <button type="submit" class="w-full gold-gradient text-black font-bold py-4 rounded-xl text-lg shadow-lg gold-glow">
          🚀 Login
        </button>
        <p id="adminError" class="text-red-400 text-sm text-center hidden"></p>
      </form>
      <p class="text-center text-gray-500 text-xs mt-4">Demo password: <strong class="text-gold-400">admin123</strong></p>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
  <header class="backdrop-blur-xl bg-black/80 shadow-lg sticky top-0 z-50 border-b border-gold-500/20">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center text-black font-bold text-lg">👑</div>
        <div>
          <h1 class="font-bold text-sm text-white leading-tight">Admin Panel</h1>
          <p class="text-xs text-gold-400">USDT Exchange PK</p>
        </div>
      </div>
      <button onclick="adminLogout()" class="text-gray-300 hover:text-red-400 text-sm font-medium bg-red-500/10 px-4 py-2 rounded-lg border border-red-500/30">Logout</button>
    </div>
  </header>

  <main class="py-6 px-4 pb-24">
    <div class="container mx-auto max-w-4xl">

      <!-- TABS -->
      <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
        <button onclick="showTab('orders')" id="tabOrders" class="tab-btn active whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black">📋 Orders</button>
        <button onclick="showTab('stats')" id="tabStats" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">📊 Stats</button>
        <button onclick="showTab('settings')" id="tabSettings" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20">⚙️ Settings</button>
      </div>

      <!-- ORDERS TAB -->
      <div id="ordersTab">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-white">Manage Orders</h2>
          <button onclick="loadOrders()" class="text-gold-400 text-sm hover:text-gold-300">🔄 Refresh</button>
        </div>
        <div id="ordersList" class="space-y-3"></div>
      </div>

      <!-- STATS TAB -->
      <div id="statsTab" class="hidden">
        <h2 class="text-xl font-bold text-white mb-4">Statistics</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">📦</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Total Orders</p>
            <p class="text-2xl font-black gold-text" id="statTotal">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">✅</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Completed</p>
            <p class="text-2xl font-black text-green-400" id="statCompleted">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">⏳</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Pending</p>
            <p class="text-2xl font-black text-gold-400" id="statPending">0</p>
          </div>
          <div class="black-card rounded-2xl p-5">
            <div class="text-2xl mb-2">❌</div>
            <p class="text-gray-400 text-xs uppercase mb-1">Rejected</p>
            <p class="text-2xl font-black text-red-400" id="statRejected">0</p>
          </div>
        </div>
      </div>

      <!-- SETTINGS TAB -->
      <div id="settingsTab" class="hidden">
        <h2 class="text-xl font-bold text-white mb-4">Settings</h2>
        <div class="black-card rounded-2xl p-6 space-y-4">
          <div>
            <label class="block text-gray-400 text-sm mb-2">💰 Buy Rate (PKR per USDT)</label>
            <input type="number" id="setBuyRate" value="290" class="input-dark w-full px-4 py-3 rounded-xl">
          </div>
          <div>
            <label class="block text-gray-400 text-sm mb-2">💵 Sell Rate (PKR per USDT)</label>
            <input type="number" id="setSellRate" value="278" class="input-dark w-full px-4 py-3 rounded-xl">
          </div>
          <div>
            <label class="block text-gray-400 text-sm mb-2">📱 JazzCash Number</label>
            <input type="text" id="setJazzcash" value="03187193663" class="input-dark w-full px-4 py-3 rounded-xl">
          </div>
          <div>
            <label class="block text-gray-400 text-sm mb-2">💎 BEP20 Address</label>
            <input type="text" id="setBep20" value="0x6e1510c624536e7a283c26f1f1fb303488244b95" class="input-dark w-full px-4 py-3 rounded-xl text-xs">
          </div>
          <button onclick="saveSettings()" class="w-full gold-gradient text-black font-bold py-3 rounded-xl">
            💾 Save Settings
          </button>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
// Check admin login
if (localStorage.getItem('admin_logged_in') === 'true') {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadOrders();
}

function adminLogin(e) {
  e.preventDefault();
  const pass = document.getElementById('adminPass').value;

  if (pass === 'admin123') {
    localStorage.setItem('admin_logged_in', 'true');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadOrders();
  } else {
    const errEl = document.getElementById('adminError');
    errEl.textContent = '❌ Password ghalat hai';
    errEl.classList.remove('hidden');
  }
}

function adminLogout() {
  localStorage.removeItem('admin_logged_in');
  window.location.reload();
}

function showTab(tab) {
  document.getElementById('ordersTab').classList.add('hidden');
  document.getElementById('statsTab').classList.add('hidden');
  document.getElementById('settingsTab').classList.add('hidden');

  document.getElementById('tabOrders').className = 'tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20';
  document.getElementById('tabStats').className = 'tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20';
  document.getElementById('tabSettings').className = 'tab-btn whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gray-900 text-gray-300 border border-gold-500/20';

  if (tab === 'orders') {
    document.getElementById('ordersTab').classList.remove('hidden');
    document.getElementById('tabOrders').className = 'tab-btn active whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black';
  } else if (tab === 'stats') {
    document.getElementById('statsTab').classList.remove('hidden');
    document.getElementById('tabStats').className = 'tab-btn active whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black';
    loadStats();
  } else if (tab === 'settings') {
    document.getElementById('settingsTab').classList.remove('hidden');
    document.getElementById('tabSettings').className = 'tab-btn active whitespace-nowrap px-5 py-2.5 rounded-xl font-semibold bg-gold-500 text-black';
  }
}

// Load orders from localStorage (demo)
function loadOrders() {
  const orders = JSON.parse(localStorage.getItem('user_orders') || '[]');
  const list = document.getElementById('ordersList');

  if (orders.length === 0) {
    list.innerHTML = `
      <div class="black-card rounded-2xl p-8 text-center">
        <div class="text-5xl mb-3">📭</div>
        <p class="text-gray-400 text-sm">Abhi tak koi order nahi</p>
        <p class="text-gray-600 text-xs mt-2">Customer order karega toh yahan dikhega</p>
      </div>
    `;
    return;
  }

  list.innerHTML = orders.map((order, index) => `
    <div class="black-card rounded-2xl p-4">
      <div class="flex justify-between items-start mb-3">
        <div>
          <p class="font-bold text-white text-sm">${order.type || 'Buy'} USDT</p>
          <p class="text-gray-500 text-xs mt-1">#${order.id || index}</p>
        </div>
        <span class="text-xs px-3 py-1 rounded-full font-semibold ${getStatusClass(order.status)}">${order.status || 'Pending'}</span>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs mb-3">
        <div>
          <p class="text-gray-500">Amount</p>
          <p class="text-white font-semibold">${order.amount || 'N/A'}</p>
        </div>
        <div>
          <p class="text-gray-500">Customer</p>
          <p class="text-white font-semibold">${order.customer || 'N/A'}</p>
        </div>
        <div>
          <p class="text-gray-500">Phone</p>
          <p class="text-white font-semibold">${order.phone || 'N/A'}</p>
        </div>
        <div>
          <p class="text-gray-500">Date</p>
          <p class="text-white font-semibold">${order.date || 'N/A'}</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="updateStatus(${index}, 'Processing')" class="flex-1 bg-blue-500/20 border border-blue-500/40 text-blue-400 py-2 rounded-lg text-xs font-semibold">Processing</button>
        <button onclick="updateStatus(${index}, 'Completed')" class="flex-1 bg-green-500/20 border border-green-500/40 text-green-400 py-2 rounded-lg text-xs font-semibold">✓ Complete</button>
        <button onclick="updateStatus(${index}, 'Rejected')" class="flex-1 bg-red-500/20 border border-red-500/40 text-red-400 py-2 rounded-lg text-xs font-semibold">✕ Reject</button>
      </div>
    </div>
  `).join('');
}

function getStatusClass(status) {
  if (status === 'Completed') return 'status-completed';
  if (status === 'Rejected') return 'status-rejected';
  if (status === 'Processing') return 'status-processing';
  return 'status-pending';
}

function updateStatus(index, newStatus) {
  const orders = JSON.parse(localStorage.getItem('user_orders') || '[]');
  if (orders[index]) {
    orders[index].status = newStatus;
    localStorage.setItem('user_orders', JSON.stringify(orders));
    loadOrders();
    alert('✅ Status updated: ' + newStatus);
  }
}

function loadStats() {
  const orders = JSON.parse(localStorage.getItem('user_orders') || '[]');
  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statCompleted').textContent = orders.filter(o => o.status === 'Completed').length;
  document.getElementById('statPending').textContent = orders.filter(o => o.status === 'Pending').length;
  document.getElementById('statRejected').textContent = orders.filter(o => o.status === 'Rejected').length;
}

function saveSettings() {
  alert('✅ Settings saved (demo)');
}
</script>

</body>
</html>
